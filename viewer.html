    <style>
        :root {
            --bg-base: #060913;
            --card-bg: rgba(18, 24, 43, 0.7);
            --card-hover-bg: rgba(28, 38, 68, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(56, 189, 248, 0.5);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            
            --nav-bg: rgba(6, 9, 19, 0.85);
            --nav-border: rgba(255, 255, 255, 0.08);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --accent-gold: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            
            --badge-bg: rgba(56, 189, 248, 0.12);
            --badge-text: #7dd3fc;
            --badge-border: rgba(56, 189, 248, 0.25);
            
            --input-bg: rgba(15, 23, 42, 0.7);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-focus-border: #38bdf8;
            
            --dropdown-bg: #0d1527;
            --dropdown-border: rgba(255, 255, 255, 0.12);
        }

        body.light-mode {
            --bg-base: #f4f6fb;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-hover-bg: #ffffff;
            --card-border: rgba(203, 213, 225, 0.8);
            --card-hover-border: rgba(2, 132, 199, 0.5);
            --card-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
            
            --nav-bg: rgba(255, 255, 255, 0.85);
            --nav-border: rgba(226, 232, 240, 0.9);
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --accent-primary: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.15);
            --accent-gold: #d97706;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #6366f1 50%, #8b5cf6 100%);
            
            --badge-bg: rgba(2, 132, 199, 0.08);
            --badge-text: #0369a1;
            --badge-border: rgba(2, 132, 199, 0.2);
            
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-focus-border: #0284c7;
            
            --dropdown-bg: #ffffff;
            --dropdown-border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
        }

        /* ── Ambient Background Glows ──────────────────────────────────── */
        .ambient-glow-wrap {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            animation: auroraFloat 22s ease-in-out infinite alternate;
        }

        .ambient-sphere-1 {
            width: 650px;
            height: 650px;
            top: -150px;
            left: 10%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, transparent 70%);
        }

        .ambient-sphere-2 {
            width: 750px;
            height: 750px;
            top: 30%;
            right: -200px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, transparent 70%);
            animation-duration: 28s;
            animation-delay: -5s;
        }

        @keyframes auroraFloat {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(50px) scale(1.08); }
            100% { transform: translateY(-30px) scale(0.96); }
        }

        .ml-font {
            font-family: 'Noto Sans Malayalam', 'Manjari', sans-serif;
        }

        /* ── Navigation Bar ────────────────────────────────────────────── */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--nav-border);
            padding: 10px 20px;
        }

        .nav-container {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-back-home:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent-primary);
            transform: translateX(-2px);
        }

        .collection-picker-select {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            max-width: 240px;
            transition: all 0.2s ease;
        }

        .collection-picker-select:hover,
        .collection-picker-select:focus {
            border-color: var(--accent-primary);
            background: var(--dropdown-bg);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            background: var(--card-hover-bg);
            border-color: var(--card-hover-border);
            transform: scale(1.05);
        }

        /* ── Main Layout Grid ──────────────────────────────────────────── */
        .viewer-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
            min-height: calc(100vh - 70px);
        }

        /* ── Sidebar (Song List) ───────────────────────────────────────── */
        .sidebar-pane {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(16px);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 100px);
            position: sticky;
            top: 80px;
        }

        .sidebar-header {
            margin-bottom: 12px;
        }

        .collection-badge-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .collection-badge-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .search-box-wrap {
            position: relative;
            margin: 12px 0 10px 0;
        }

        .sidebar-search-input {
            width: 100%;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 12px;
            padding: 10px 36px 10px 14px;
            font-size: 0.9rem;
            color: var(--text-primary);
            outline: none;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .sidebar-search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .sidebar-search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--card-border);
            border: none;
            color: var(--text-secondary);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .sidebar-filter-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .fav-filter-btn {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fb7185;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .fav-filter-btn.active {
            background: #f43f5e;
            color: white;
        }

        .songs-count-text {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .song-list-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .song-list-scroll::-webkit-scrollbar { width: 6px; }
        .song-list-scroll::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 6px; }

        .song-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: all 0.15s ease;
            color: var(--text-primary);
            border: 1px solid transparent;
        }

        .song-list-item:hover {
            background: var(--card-hover-bg);
            border-color: var(--card-border);
            transform: translateX(3px);
        }

        .song-list-item.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 14px var(--accent-glow);
            transform: translateX(4px);
        }

        .song-list-num {
            background: rgba(255, 255, 255, 0.12);
            font-weight: 800;
            font-size: 0.85rem;
            min-width: 38px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .song-list-item.active .song-list-num {
            background: rgba(0, 0, 0, 0.2);
            color: white;
        }

        .song-list-info {
            flex: 1;
            min-width: 0;
        }

        .song-list-name {
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-list-ml {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-list-item.active .song-list-ml {
            color: rgba(255, 255, 255, 0.9);
        }

        /* ── Display Pane (Lyrics & Video Reader) ───────────────────────── */
        .display-pane {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 32px;
            backdrop-filter: blur(16px);
            box-shadow: var(--card-shadow);
            overflow-y: auto;
            min-height: calc(100vh - 100px);
        }

        .song-reader-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1.5px solid var(--card-border);
            margin-bottom: 24px;
        }

        .reader-title-group {
            flex: 1;
        }

        .reader-song-num-pill {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 800;
            background: var(--badge-bg);
            color: var(--accent-primary);
            border: 1px solid var(--badge-border);
            padding: 3px 10px;
            border-radius: 9999px;
            margin-bottom: 6px;
        }

        .reader-title-en {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1.25;
        }

        .reader-title-ml {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin-top: 4px;
        }

        /* ── Action Toolbar ────────────────────────────────────────────── */
        .reader-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-pill-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .action-pill-btn:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent-primary);
            transform: translateY(-1px);
        }

        .action-pill-btn.fav.active {
            background: #f43f5e;
            color: white;
            border-color: transparent;
        }

        .action-pill-btn.whatsapp {
            background: #25d366;
            color: #042f2e;
            border-color: transparent;
        }

        .action-pill-btn.whatsapp:hover {
            background: #22c55e;
            color: white;
        }

        /* ── Lyrics Layout ─────────────────────────────────────────────── */
        .lyrics-body {
            font-family: 'Noto Sans Malayalam', 'Manjari', sans-serif;
            font-size: 1.15rem;
            line-height: 2.2;
            color: var(--text-primary);
            white-space: pre-wrap;
            margin-bottom: 36px;
            padding: 10px 4px;
            letter-spacing: 0.01em;
        }

        /* ── YouTube Video Player Container ────────────────────────────── */
        .video-wrapper-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .video-inner {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }

        .video-inner iframe,
        .video-inner #ytPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── Custom Clip Player Controls ────────────────────────────────── */
        .clip-player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(10, 15, 30, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            user-select: none;
        }

        .clip-ctrl-btn {
            background: transparent;
            border: none;
            color: #38bdf8;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .clip-ctrl-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            color: #7dd3fc;
            transform: scale(1.05);
        }

        .clip-time-display {
            font-size: 0.85rem;
            font-family: monospace;
            color: #94a3b8;
            min-width: 34px;
            text-align: center;
        }

        .clip-scrubber {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clip-scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .clip-scrubber::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .clip-scrubber::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #38bdf8;
            border: none;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
            cursor: pointer;
        }

        /* ── Bottom Prev / Next Float Bar ──────────────────────────────── */
        .bottom-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
        }

        .btn-nav-step {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-nav-step:hover:not(:disabled) {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
        }

        .btn-nav-step:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .empty-selection-placeholder {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        /* ── Mobile Layout ─────────────────────────────────────────────── */
        @media (max-width: 900px) {
            .viewer-container {
                grid-template-columns: 1fr;
            }
            .sidebar-pane {
                height: auto;
                max-height: 380px;
                position: static;
            }
            .reader-title-en { font-size: 1.4rem; }
            .reader-title-ml { font-size: 1.25rem; }
            .song-reader-header { flex-direction: column; }
            .reader-actions { width: 100%; }
        }
    </style>
</head>

    <!-- ── Main Grid ─────────────────────────────────────────────────── -->
    <div class="viewer-container">

        <aside class="sidebar-pane">
            <div class="sidebar-header">
                <div class="collection-badge-title" id="sidebarColTitle">Loading Collection...</div>
                <div class="collection-badge-subtitle ml-font" id="sidebarColSubtitle">ക്രിസ്തീയ ഗാനങ്ങൾ</div>
            </div>

            <div class="search-box-wrap">
                <input 
                    type="text" 
                    id="sidebarSearchInput" 
                    class="sidebar-search-input" 
                    placeholder="Search name or number..." 
                    autocomplete="off"
                    aria-label="Filter hymns"
                >
                <button id="sidebarSearchClear" class="sidebar-search-clear" onclick="clearSidebarSearch()" aria-label="Clear filter">✕</button>
            </div>

            <div class="sidebar-filter-row">
                <button class="fav-filter-btn" id="favFilterBtn" onclick="toggleFavoritesFilter()">
                    <span>❤️</span> Favorites (<span id="favFilterCount">0</span>)
                </button>
                <span class="songs-count-text" id="songsCountLabel">0 songs</span>
            </div>

            <div class="song-list-scroll" id="songListScroll">
                <!-- Song items populated via JS -->
            </div>
        </aside>

        <!-- ── Right Display Pane (Reader & Player) ──────────────────── -->
        <main class="display-pane" id="songDisplayPane">
            <div class="empty-selection-placeholder" id="emptyPlaceholder">
                <div style="font-size: 3rem; margin-bottom: 12px;">🎵</div>
                <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">Select a Hymn to View Lyrics</h2>
                <p>Choose any song from the left sidebar to start reading and playing video recording.</p>
            </div>

            <div id="songReaderContent" style="display: none;">
                <!-- Dynamically generated reader view -->
            </div>
        </main>

    </div>

    <!-- ── Scripts ───────────────────────────────────────────────────── -->
    <script>
        // ── Theme Switcher ────────────────────────────────────────────
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            setTheme(savedTheme);
        }

        function setTheme(theme) {
            const btn = document.getElementById('themeToggleBtn');
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                btn.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        function toggleTheme() {
            const isLight = document.body.classList.contains('light-mode');
            setTheme(isLight ? 'dark' : 'light');
        }

        initTheme();

        // ── Collection Metadata ───────────────────────────────────────
        const collectionMeta = {
            'kristheeya-keerthanangal': { title: 'Kristheeya Keerthanangal', subtitle: 'ക്രിസ്തീയ കീർത്തനങ്ങൾ • 517 Hymns' },
            'holy-communion': { title: 'Holy Communion', subtitle: 'വിശുദ്ധ കുർബ്ബാന ഗാനങ്ങൾ • 22 Songs' },
            'passion-week': { title: 'Passion Week', subtitle: 'കഷ്ടാനുഭവ വാര ഗാനങ്ങൾ • 23 Songs' },
            'birthday-anniversary': { title: 'Special Occasions', subtitle: 'പ്രത്യേക പ്രാർത്ഥനകൾ • 15 Songs' },
            'maramon-2026': { title: 'Maramon Convention 2026', subtitle: 'മാരാമൺ 2026 (NEW) • 16 Songs' },
            'maramon-2025': { title: 'Maramon Convention 2025', subtitle: 'മാരാമൺ 2025 • 16 Songs' },
            'maramon-2024': { title: 'Maramon Convention 2024', subtitle: 'മാരാമൺ 2024 • 16 Songs' },
            'maramon-2023': { title: 'Maramon Convention 2023', subtitle: 'മാരാമൺ 2023 • 12 Songs' },
            'maramon-2021': { title: 'Maramon Convention 2021', subtitle: 'മാരാമൺ 2021 • 20 Songs' },
            'maramon-2013': { title: 'Maramon Convention 2013', subtitle: 'മാരാമൺ 2013 • 16 Songs' },
            'maramon-2008': { title: 'Maramon Convention 2008', subtitle: 'മാരാമൺ 2008 • 1 Song' },
            'maramon-2006': { title: 'Maramon Convention 2006', subtitle: 'മാരാമൺ 2006 • 1 Song' },
            'kottarakara-2026': { title: 'Kottarakara Convention 2026', subtitle: 'കൊട്ടാരക്കര 2026 (NEW) • 10 Songs' },
            'kottarakara-2025': { title: 'Kottarakara Convention 2025', subtitle: 'കൊട്ടാരക്കര 2025 • 10 Songs' }
        };

        const urlParams = new URLSearchParams(window.location.search);
        let currentCollection = urlParams.get('collection') || 'kristheeya-keerthanangal';
        let songs = [];
        let filteredSongs = [];
        let currentSongIndex = -1;
        let showingFavorites = false;

        // Sync dropdown
        const picker = document.getElementById('collectionPicker');
        if (picker) picker.value = currentCollection;

        function switchCollection(newCol) {
            window.location.href = `viewer.html?collection=${encodeURIComponent(newCol)}`;
        }

        // Favorites Helpers
        function getFavorites() {
            const favs = localStorage.getItem(`favorites_${currentCollection}`);
            return favs ? JSON.parse(favs) : [];
        }

        function saveFavorites(favorites) {
            localStorage.setItem(`favorites_${currentCollection}`, JSON.stringify(favorites));
            updateFavCount();
        }

        function toggleFavorite(songNumber) {
            let favorites = getFavorites();
            const idx = favorites.indexOf(songNumber);
            if (idx > -1) {
                favorites.splice(idx, 1);
            } else {
                favorites.push(songNumber);
            }
            saveFavorites(favorites);
            renderSongList();
            if (currentSongIndex >= 0 && filteredSongs[currentSongIndex]) {
                renderReader(filteredSongs[currentSongIndex]);
            }
        }

        function updateFavCount() {
            const count = getFavorites().length;
            document.getElementById('favFilterCount').textContent = count;
        }

        function toggleFavoritesFilter() {
            showingFavorites = !showingFavorites;
            const btn = document.getElementById('favFilterBtn');
            btn.classList.toggle('active', showingFavorites);
            applyFilter();
        }

        // ── Load Collection Data ──────────────────────────────────────
        async function loadCollection() {
            const meta = collectionMeta[currentCollection] || { title: currentCollection, subtitle: 'Malayalam Hymns' };
            document.getElementById('sidebarColTitle').textContent = meta.title;
            document.getElementById('sidebarColSubtitle').textContent = meta.subtitle;
            document.title = `${meta.title} | Holy Hymns`;

            try {
                const res = await fetch(`data/${currentCollection}.json`);
                if (res.ok) {
                    songs = await res.json();
                    filteredSongs = songs;
                    document.getElementById('songsCountLabel').textContent = `${songs.length} songs`;
                    updateFavCount();
                    renderSongList();

                    // Check URL parameter for initial song
                    const songParam = urlParams.get('song');
                    if (songParam) {
                        const targetIdx = songs.findIndex(s => s.number == songParam);
                        if (targetIdx >= 0) selectSongIndex(targetIdx);
                    } else if (songs.length > 0) {
                        selectSongIndex(0);
                    }
                }
            } catch (err) {
                console.error('Failed to load collection:', err);
                document.getElementById('songListScroll').innerHTML = '<p style="padding:20px; color:#ef4444;">Failed to load songs.</p>';
            }
        }

        loadCollection();

        // ── Search & Filter ───────────────────────────────────────────
        const searchInput = document.getElementById('sidebarSearchInput');
        const searchClear = document.getElementById('sidebarSearchClear');

        searchInput.addEventListener('input', () => {
            searchClear.style.display = searchInput.value ? 'flex' : 'none';
            applyFilter();
        });

        function clearSidebarSearch() {
            searchInput.value = '';
            searchClear.style.display = 'none';
            applyFilter();
            searchInput.focus();
        }

        function applyFilter() {
            const q = searchInput.value.toLowerCase().trim();
            const favorites = getFavorites();

            filteredSongs = songs.filter(s => {
                if (showingFavorites && !favorites.includes(s.number)) return false;
                if (!q) return true;
                if (s.number.toString().includes(q)) return true;
                if (s.name && s.name.toLowerCase().includes(q)) return true;
                if (s.name2 && s.name2.includes(q)) return true;
                return false;
            });

            document.getElementById('songsCountLabel').textContent = `${filteredSongs.length} songs`;
            renderSongList();
        }

        // ── Render Song List ──────────────────────────────────────────
        function renderSongList() {
            const listScroll = document.getElementById('songListScroll');
            listScroll.innerHTML = '';

            if (filteredSongs.length === 0) {
                listScroll.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted);">No songs found.</div>';
                return;
            }

            const favorites = getFavorites();

            filteredSongs.forEach((song, idx) => {
                const isFav = favorites.includes(song.number);
                const isActive = idx === currentSongIndex;

                const item = document.createElement('div');
                item.className = 'song-list-item' + (isActive ? ' active' : '');
                item.innerHTML = `
                    <div class="song-list-num">#${song.number}</div>
                    <div class="song-list-info">
                        <div class="song-list-name">${escapeHtml(song.name || '')}</div>
                        <div class="song-list-ml ml-font">${escapeHtml(song.name2 || '')}</div>
                    </div>
                    ${isFav ? '<span style="color:#fb7185; font-size:12px;">❤️</span>' : ''}
                `;

                item.addEventListener('click', () => selectSongIndex(idx));
                listScroll.appendChild(item);
            });
        }

        // ── Select Song ───────────────────────────────────────────────
        function selectSongIndex(index) {
            if (index < 0 || index >= filteredSongs.length) return;
            currentSongIndex = index;
            const song = filteredSongs[currentSongIndex];

            // Update active state in sidebar
            const items = document.querySelectorAll('.song-list-item');
            items.forEach((it, i) => it.classList.toggle('active', i === currentSongIndex));

            renderReader(song);
            document.getElementById('emptyPlaceholder').style.display = 'none';
            document.getElementById('songReaderContent').style.display = 'block';
            document.getElementById('songDisplayPane').scrollTop = 0;
        }

        function formatDuration(sec) {
            const s = Math.max(0, Math.floor(sec || 0));
            const m = Math.floor(s / 60);
            const rem = s % 60;
            return `${m}:${rem < 10 ? '0' : ''}${rem}`;
        }

        let activeYtPlayer = null;
        let pendingYtInit = null;
        let clipProgressTimer = null;
        let isClipPlaying = false;
        let clipCurrentTime = 0;
        let currentClipStart = 0;
        let currentClipEnd = 0;
        let currentIsClipped = false;

        function clearClipTimer() {
            if (clipProgressTimer) {
                clearInterval(clipProgressTimer);
                clipProgressTimer = null;
            }
        }

        function setClipPlayState(isPlaying) {
            isClipPlaying = isPlaying;
            const playIcon = document.getElementById('clipPlayIcon');
            const pauseIcon = document.getElementById('clipPauseIcon');
            if (playIcon && pauseIcon) {
                playIcon.style.display = isPlaying ? 'none' : 'block';
                pauseIcon.style.display = isPlaying ? 'block' : 'none';
            }
        }

        function updateClipUIOnEnd(startTime) {
            setClipPlayState(false);
            clipCurrentTime = startTime || 0;
            const scrubber = document.getElementById('clipScrubber');
            const curTime = document.getElementById('clipCurTime');
            if (scrubber) scrubber.value = startTime || 0;
            if (curTime) curTime.textContent = '0:00';
        }

        function sendYtCommand(func, args) {
            if (activeYtPlayer && typeof activeYtPlayer[func] === 'function') {
                try {
                    if (Array.isArray(args)) {
                        activeYtPlayer[func](...args);
                    } else if (args !== undefined && args !== '') {
                        activeYtPlayer[func](args);
                    } else {
                        activeYtPlayer[func]();
                    }
                } catch (e) {}
            }

            const iframe = document.getElementById('ytPlayer');
            if (iframe && iframe.contentWindow) {
                try {
                    const msg = JSON.stringify({
                        event: 'command',
                        func: func,
                        args: args !== undefined ? args : ''
                    });
                    iframe.contentWindow.postMessage(msg, '*');
                } catch (e) {}
            }
        }

        function updateClipTimeUI(cur, startTime, endTime) {
            if (!currentIsClipped) return;
            const scrubber = document.getElementById('clipScrubber');
            const curTime = document.getElementById('clipCurTime');
            if (scrubber && document.activeElement !== scrubber) {
                scrubber.value = Math.max(startTime, Math.min(endTime, cur));
            }
            if (curTime) {
                const elapsed = Math.max(0, cur - startTime);
                curTime.textContent = formatDuration(elapsed);
            }
        }

        function handleClipStateChange(state, startTime, endTime) {
            if (!currentIsClipped) return;

            if (state === 1) { // PLAYING
                setClipPlayState(true);
                startClipTicker(startTime, endTime);
            } else if (state === 2) { // PAUSED
                setClipPlayState(false);
                clearClipTimer();
            } else if (state === 0) { // ENDED
                clearClipTimer();
                sendYtCommand('seekTo', [startTime || 0, true]);
                sendYtCommand('pauseVideo');
                updateClipUIOnEnd(startTime);
            }
        }

        function startClipTicker(startTime, endTime) {
            clearClipTimer();
            if (!currentIsClipped || !endTime || endTime <= startTime) return;

            clipProgressTimer = setInterval(() => {
                if (!currentIsClipped) {
                    clearClipTimer();
                    return;
                }

                if (activeYtPlayer && typeof activeYtPlayer.getCurrentTime === 'function') {
                    try {
                        const cur = activeYtPlayer.getCurrentTime();
                        if (!isNaN(cur) && cur > 0) {
                            clipCurrentTime = cur;
                        }
                    } catch (e) {}
                }

                if (currentIsClipped && endTime > startTime && clipCurrentTime >= endTime) {
                    clearClipTimer();
                    sendYtCommand('seekTo', [startTime || 0, true]);
                    sendYtCommand('pauseVideo');
                    updateClipUIOnEnd(startTime);
                    return;
                }

                updateClipTimeUI(clipCurrentTime, startTime, endTime);
            }, 250);
        }

        // Global listener for YouTube iframe postMessage notifications
        window.addEventListener('message', function(event) {
            if (!event.origin || !event.origin.includes('youtube.com')) return;
            if (!currentIsClipped) return; // Only process custom controls for clipped videos!

            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                if (!data) return;
                if (data.event === 'infoDelivery' && data.info) {
                    if (typeof data.info.playerState !== 'undefined') {
                        handleClipStateChange(data.info.playerState, currentClipStart, currentClipEnd);
                    }
                    if (typeof data.info.currentTime !== 'undefined') {
                        clipCurrentTime = data.info.currentTime;
                        updateClipTimeUI(data.info.currentTime, currentClipStart, currentClipEnd);
                    }
                } else if (data.event === 'onStateChange') {
                    handleClipStateChange(data.info, currentClipStart, currentClipEnd);
                }
            } catch (e) {}
        });

        function setupClipControls(startTime, endTime) {
            const playBtn = document.getElementById('clipPlayBtn');
            const scrubber = document.getElementById('clipScrubber');
            const curTime = document.getElementById('clipCurTime');
            const muteBtn = document.getElementById('clipMuteBtn');
            const fsBtn = document.getElementById('clipFsBtn');

            if (!playBtn || !scrubber) return;

            playBtn.onclick = function() {
                if (isClipPlaying) {
                    sendYtCommand('pauseVideo');
                    setClipPlayState(false);
                    clearClipTimer();
                } else {
                    if (clipCurrentTime >= endTime || clipCurrentTime < startTime) {
                        clipCurrentTime = startTime;
                        sendYtCommand('seekTo', [startTime || 0, true]);
                    }
                    sendYtCommand('playVideo');
                    setClipPlayState(true);
                    startClipTicker(startTime, endTime);
                }
            };

            scrubber.oninput = function() {
                const val = parseFloat(this.value);
                clipCurrentTime = val;
                if (curTime) {
                    curTime.textContent = formatDuration(val - startTime);
                }
            };

            scrubber.onchange = function() {
                const val = parseFloat(this.value);
                clipCurrentTime = val;
                sendYtCommand('seekTo', [val, true]);
            };

            let isMuted = false;
            if (muteBtn) {
                muteBtn.onclick = function() {
                    isMuted = !isMuted;
                    sendYtCommand(isMuted ? 'mute' : 'unMute');
                    const volOn = document.getElementById('clipVolOn');
                    const volOff = document.getElementById('clipVolOff');
                    if (volOn) volOn.style.display = isMuted ? 'none' : 'block';
                    if (volOff) volOff.style.display = isMuted ? 'block' : 'none';
                };
            }

            if (fsBtn) {
                fsBtn.onclick = function() {
                    const iframe = document.getElementById('ytPlayer');
                    if (!iframe) return;
                    if (iframe.requestFullscreen) {
                        iframe.requestFullscreen();
                    } else if (iframe.webkitRequestFullscreen) {
                        iframe.webkitRequestFullscreen();
                    } else if (iframe.msRequestFullscreen) {
                        iframe.msRequestFullscreen();
                    }
                };
            }
        }

        window.onYouTubeIframeAPIReady = function() {
            if (typeof pendingYtInit === 'function') {
                pendingYtInit();
                pendingYtInit = null;
            }
        };

        function initYoutubeEndReset(startTime, endTime, isClipped) {
            currentIsClipped = !!isClipped;
            currentClipStart = startTime || 0;
            currentClipEnd = endTime || 0;
            clipCurrentTime = startTime || 0;
            isClipPlaying = false;
            clearClipTimer();

            const bindPlayer = () => {
                const iframe = document.getElementById('ytPlayer');
                if (!iframe || !window.YT || !window.YT.Player) return;

                try {
                    activeYtPlayer = new YT.Player('ytPlayer', {
                        events: {
                            'onStateChange': function(event) {
                                if (currentIsClipped) {
                                    handleClipStateChange(event.data, startTime, endTime);
                                } else if (event.data === 0) {
                                    try {
                                        activeYtPlayer.seekTo(startTime || 0, true);
                                        activeYtPlayer.pauseVideo();
                                    } catch (err) {}
                                }
                            }
                        }
                    });
                } catch (e) {
                    console.warn('Failed to bind YT.Player:', e);
                }
            };

            if (window.YT && window.YT.Player) {
                bindPlayer();
            } else {
                pendingYtInit = bindPlayer;
            }

            // Register listening state with iframe for postMessage events only if clipped
            if (currentIsClipped) {
                setTimeout(() => {
                    const iframe = document.getElementById('ytPlayer');
                    if (iframe && iframe.contentWindow) {
                        try {
                            iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening' }), '*');
                        } catch (e) {}
                    }
                }, 300);
            }
        }

        function renderReader(song) {
            const container = document.getElementById('songReaderContent');
            const favorites = getFavorites();
            const isFav = favorites.includes(song.number);

            clearClipTimer();
            currentIsClipped = false;
            currentClipStart = 0;
            currentClipEnd = 0;
            clipCurrentTime = 0;
            isClipPlaying = false;

            if (activeYtPlayer && typeof activeYtPlayer.destroy === 'function') {
                try { activeYtPlayer.destroy(); } catch (e) {}
                activeYtPlayer = null;
            }

            let videoId = '';
            let startTime = 0;
            let endTime = 0;
            let isClipped = false;
            let embedUrl = '';

            if (song.youtubeId) {
                const parts = song.youtubeId.split('?');
                videoId = parts[0];
                const searchParams = new URLSearchParams(parts[1] || '');
                if (searchParams.has('start')) {
                    startTime = parseInt(searchParams.get('start'), 10) || 0;
                }
                if (searchParams.has('end')) {
                    endTime = parseInt(searchParams.get('end'), 10) || 0;
                    if (endTime > startTime) {
                        isClipped = true;
                        // Remove 'end' param so YouTube never hits ENDED state and never displays related video grid
                        searchParams.delete('end');
                    }
                }
                searchParams.set('enablejsapi', '1');
                searchParams.set('rel', '0');
                searchParams.set('modestbranding', '1');
                searchParams.set('iv_load_policy', '3');
                searchParams.set('playsinline', '1');
                if (isClipped) {
                    searchParams.set('controls', '0');
                }
                if (window.location.origin && window.location.origin !== 'null') {
                    searchParams.set('origin', window.location.origin);
                }
                embedUrl = `https://www.youtube.com/embed/${videoId}?${searchParams.toString()}`;
            }

            container.innerHTML = `
                <div class="song-reader-header">
                    <div class="reader-title-group">
                        <span class="reader-song-num-pill">Hymn #${song.number}</span>
                        <h1 class="reader-title-en">${escapeHtml(song.name || '')}</h1>
                        <div class="reader-title-ml ml-font">${escapeHtml(song.name2 || '')}</div>
                    </div>

                    <div class="reader-actions">
                        <button class="action-pill-btn fav ${isFav ? 'active' : ''}" onclick="toggleFavorite('${song.number}')">
                            <span>${isFav ? '❤️' : '🤍'}</span> ${isFav ? 'Saved' : 'Favorite'}
                        </button>
                        <button class="action-pill-btn whatsapp" onclick="shareWhatsApp()">
                            <svg class="btn-svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block; vertical-align:middle; margin-right:4px;"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.669-.699c.969.587 1.844.896 2.791.896h.001c3.181 0 5.767-2.586 5.768-5.766 0-1.54-.599-2.988-1.688-4.077-1.09-1.089-2.537-1.688-4.08-1.688zm6.545 8.788c-.287.809-1.42 1.488-2.33 1.685-.623.134-1.439.243-4.175-.889-3.501-1.448-5.753-5.019-5.928-5.25-.174-.231-1.426-1.897-1.426-3.618 0-1.721.9-2.569 1.222-2.918.322-.349.702-.436.936-.436.234 0 .468.002.673.012.219.01.512-.083.801.611.297.716 1.014 2.474 1.103 2.653.089.179.148.389.03.623-.118.234-.177.38-.352.585-.175.205-.369.458-.528.615-.176.174-.36.363-.155.714.205.351.912 1.503 1.956 2.433 1.344 1.197 2.477 1.569 2.828 1.744.351.175.556.146.761-.088.205-.234.877-1.022 1.111-1.373.234-.351.468-.293.79-.175.322.118 2.046.966 2.397 1.141.351.175.585.263.673.409.088.146.088.848-.199 1.657z"/><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.98-1.396A9.957 9.957 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18c-1.637 0-3.155-.494-4.417-1.344l-.317-.214-3.284.92.936-3.197-.234-.336A7.95 7.95 0 014 12c0-4.411 3.589-8 8-8s8 3.589 8 8-3.589 8-8 8z"/></svg> WhatsApp
                        </button>
                        <button class="action-pill-btn" onclick="copyLyrics()">
                            <span>📋</span> Copy
                        </button>
                        <button class="action-pill-btn" onclick="window.print()">
                            <span>🖨️</span> Print
                        </button>
                    </div>
                </div>

                <div class="lyrics-body" id="lyricsText">${escapeHtml(song.lyrics || '(Lyrics available in official hymnal book)')}</div>

                ${song.youtubeId ? `
                    <div class="video-wrapper-box">
                        <div class="video-inner">
                            <iframe id="ytPlayer" src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                        ${isClipped ? `
                            <div class="clip-player-controls" id="clipControls">
                                <button class="clip-ctrl-btn" id="clipPlayBtn" title="Play / Pause" aria-label="Play / Pause">
                                    <svg id="clipPlayIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                    <svg id="clipPauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                </button>
                                <span class="clip-time-display" id="clipCurTime">0:00</span>
                                <input type="range" class="clip-scrubber" id="clipScrubber" min="${startTime}" max="${endTime}" value="${startTime}" step="0.5">
                                <span class="clip-time-display" id="clipTotalTime">${formatDuration(endTime - startTime)}</span>
                                <button class="clip-ctrl-btn" id="clipMuteBtn" title="Mute / Unmute" aria-label="Mute / Unmute">
                                    <svg id="clipVolOn" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                    <svg id="clipVolOff" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                                </button>
                                <button class="clip-ctrl-btn" id="clipFsBtn" title="Fullscreen" aria-label="Fullscreen">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                ` : ''}

                <div class="bottom-nav-bar">
                    <button class="btn-nav-step" onclick="prevSong()" ${currentSongIndex <= 0 ? 'disabled' : ''}>
                        <span>◀</span> Previous Hymn
                    </button>
                    <button class="btn-nav-step" onclick="nextSong()" ${currentSongIndex >= filteredSongs.length - 1 ? 'disabled' : ''}>
                        Next Hymn <span>▶</span>
                    </button>
                </div>
            `;

            if (song.youtubeId) {
                if (isClipped) {
                    setupClipControls(startTime, endTime);
                }
                initYoutubeEndReset(startTime, endTime, isClipped);
            }
        }

        function prevSong() {
            if (currentSongIndex > 0) selectSongIndex(currentSongIndex - 1);
        }

        function nextSong() {
            if (currentSongIndex < filteredSongs.length - 1) selectSongIndex(currentSongIndex + 1);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft') prevSong();
            if (e.key === 'ArrowRight') nextSong();
        });

        // Copy Lyrics
        function copyLyrics() {
            const song = filteredSongs[currentSongIndex];
            if (!song) return;
            const text = `${song.name} (${song.name2 || ''})\n\n${song.lyrics || ''}\n\nVia Holy Hymns: https://shibinj.github.io/Hymn_project/`;
            navigator.clipboard.writeText(text).then(() => {
                alert('📋 Lyrics copied to clipboard!');
            });
        }

        // WhatsApp Share
        function shareWhatsApp() {
            const song = filteredSongs[currentSongIndex];
            if (!song) return;
            const text = `🎵 *${song.name}* ${song.name2 ? '(' + song.name2 + ')' : ''}\n\n${song.lyrics || ''}\n\nMore Hymns found at: https://shibinj.github.io/Hymn_project/`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[m]));
        }
    </script>
</body>
</html>
