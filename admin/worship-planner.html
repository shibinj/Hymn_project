<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">

    <style>
        :root {
            --bg-base: #060913;
            --card-bg: rgba(18, 24, 43, 0.8);
            --card-hover-bg: rgba(28, 38, 68, 0.9);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --accent-gold: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            
            --input-bg: rgba(15, 23, 42, 0.75);
            --input-border: rgba(255, 255, 255, 0.14);
            --input-focus-border: #38bdf8;
            
            --section-bg: rgba(255, 255, 255, 0.03);
            --section-border: rgba(255, 255, 255, 0.08);
        }

        body.light-mode {
            --bg-base: #f4f6fb;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-hover-bg: #ffffff;
            --card-border: rgba(203, 213, 225, 0.8);
            --card-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --accent-primary: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.15);
            --accent-gold: #d97706;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #6366f1 50%, #8b5cf6 100%);
            
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-focus-border: #0284c7;
            
            --section-bg: #f8fafc;
            --section-border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: 20px 12px; 
            background: var(--bg-base); 
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
        }

        .ambient-glow-wrap { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .ambient-sphere { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; }
        .ambient-sphere-1 { width: 600px; height: 600px; top: -150px; left: 10%; background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, transparent 70%); }
        .ambient-sphere-2 { width: 650px; height: 650px; top: 30%; right: -200px; background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 70%); }

        .container { 
            max-width: 960px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            border-radius: 24px; 
            padding: 28px; 
            box-shadow: var(--card-shadow); 
            backdrop-filter: blur(16px);
            position: relative;
            z-index: 1;
        }

        .app-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .btn-top-nav {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-top-nav:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent-primary);
            transform: translateX(-2px);
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        h1 { color: var(--text-primary); margin-bottom: 4px; font-size: 1.85rem; font-weight: 800; letter-spacing: -0.02em; }
        .subtitle { color: var(--text-secondary); margin-bottom: 20px; font-size: 0.95rem; }

        .service-info { 
            background: var(--section-bg); 
            border: 1px solid var(--section-border);
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
        }
        .service-info label { display: block; font-weight: 700; margin-bottom: 6px; color: var(--text-primary); font-size: 0.88rem; }
        .service-info input, .service-info select { 
            width: 100%; 
            padding: 10px 14px; 
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1.5px solid var(--input-border); 
            border-radius: 10px; 
            font-size: 0.95rem; 
            outline: none;
            font-family: inherit;
        }
        .service-info input:focus, .service-info select:focus { border-color: var(--accent-primary); }

        .controls { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        button { 
            padding: 10px 18px; 
            background: var(--accent-primary); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 0.88rem; 
            font-weight: 700; 
            white-space: nowrap; 
            transition: all 0.2s ease; 
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px var(--accent-glow); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .print-btn { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); border: 1px solid var(--card-border); }
        .save-btn { background: linear-gradient(135deg, #10b981, #059669); }
        .history-btn { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
        .whatsapp-btn { background: #25d366; color: #042f2e; }
        .whatsapp-btn:hover:not(:disabled) { background: #22c55e; color: white; }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            padding: 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .icon-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.25); }

        .service-section { 
            background: var(--section-bg); 
            border: 1px solid var(--section-border);
            padding: 18px; 
            border-radius: 16px; 
            margin-bottom: 16px; 
            position: relative;
        }
        .section-title { font-size: 1.1rem; font-weight: 800; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
        
        .song-item { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            padding: 14px; 
            border-radius: 12px; 
            margin-bottom: 10px; 
        }
        .song-number { font-weight: 800; color: var(--accent-primary); font-size: 1.05rem; display: block; margin-bottom: 4px; }
        .song-name { color: var(--text-primary); font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
        .song-collection { font-size: 0.75rem; color: var(--text-muted); background: rgba(255, 255, 255, 0.08); padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 8px; font-weight: 600; }

        .manual-input { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .manual-input input { padding: 9px 12px; background: var(--input-bg); color: var(--text-primary); border: 1.5px solid var(--input-border); border-radius: 8px; font-size: 0.9rem; flex: 1; min-width: 100px; outline: none; }
        .manual-input input:focus { border-color: var(--accent-primary); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; padding: 16px; overflow-y: auto; backdrop-filter: blur(8px); }
        .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-primary); margin: 30px auto; padding: 24px; border-radius: 20px; max-width: 800px; max-height: 90vh; overflow-y: auto; box-shadow: var(--card-shadow); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
        .modal-header h2 { font-size: 1.35rem; font-weight: 800; }
        .close-btn { font-size: 26px; cursor: pointer; color: var(--text-muted); line-height: 1; }
        .close-btn:hover { color: var(--text-primary); }

        .history-item { background: var(--section-bg); border: 1px solid var(--section-border); padding: 16px; border-radius: 12px; margin-bottom: 12px; }
        .history-date { font-weight: 800; color: var(--accent-primary); font-size: 0.95rem; }
        .history-theme { color: var(--accent-gold); font-size: 0.88rem; margin: 4px 0; font-weight: 600; }
        .history-songs { font-size: 0.85rem; color: var(--text-secondary); margin-top: 8px; }

        .filter-section { background: var(--section-bg); border: 1px solid var(--section-border); padding: 14px; border-radius: 12px; margin-bottom: 16px; }
        .filter-section input { padding: 8px 12px; background: var(--input-bg); color: var(--text-primary); border: 1.5px solid var(--input-border); border-radius: 8px; margin: 5px 5px 5px 0; font-size: 0.9rem; }
        
        .warning { color: #ef4444; font-size: 0.8rem; margin-top: 5px; font-weight: 600; }
        .recently-used { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }

        @media print {
            body { background: white !important; color: black !important; padding: 0; }
            .ambient-glow-wrap, .controls, .modal, button, .recently-used, .app-header-row, #authSection, #authInfo { display: none !important; }
            .container { box-shadow: none !important; border: none !important; padding: 20px !important; background: white !important; }
            h1, .subtitle, .section-title, .song-name { color: black !important; }
            .service-section, .song-item { background: white !important; border: 1px solid #ddd !important; }
        }
    
        .controls-toolbar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
        .action-btn { 
            padding: 10px 16px; 
            border-radius: 12px; 
            font-size: 0.88rem; 
            font-weight: 700; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 7px; 
            border: 1px solid var(--card-border); 
            background: var(--card-bg); 
            color: var(--text-primary); 
            transition: all 0.2s ease; 
            font-family: inherit;
        }
        .action-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 14px var(--accent-glow); border-color: var(--accent-primary); }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .action-btn.primary-btn { background: var(--accent-gradient); color: white; border-color: transparent; }
        .action-btn.save-btn { background: linear-gradient(135deg, #10b981, #059669); color: white; border-color: transparent; }
        .action-btn.whatsapp-btn { background: #25d366; color: #042f2e; border-color: transparent; }
        .action-btn.whatsapp-btn:hover:not(:disabled) { background: #22c55e; color: white; }
        .action-btn.history-btn { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; border-color: transparent; }
        .action-btn.print-btn { background: rgba(255, 255, 255, 0.08); }
        .action-btn.sync-btn { background: rgba(16, 185, 129, 0.15); color: #10b981; border-color: rgba(16, 185, 129, 0.3); }

        .convention-select-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .convention-select-wrap label { font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); }
        .convention-select-wrap select, .modern-select { padding: 9px 12px; background: var(--input-bg); color: var(--text-primary); border: 1.5px solid var(--input-border); border-radius: 10px; font-family: inherit; font-size: 0.88rem; outline: none; }

        .modern-input { padding: 9px 12px; background: var(--input-bg); color: var(--text-primary); border: 1.5px solid var(--input-border); border-radius: 10px; font-family: inherit; font-size: 0.88rem; outline: none; }
        .modern-input:focus, .modern-select:focus { border-color: var(--accent-primary); }

        .song-card-content { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
        .song-num-badge { 
            background: var(--badge-bg); 
            color: var(--accent-primary); 
            border: 1.5px solid var(--badge-border); 
            font-size: 1.15rem; 
            font-weight: 800; 
            padding: 8px 14px; 
            border-radius: 12px; 
            min-width: 60px; 
            text-align: center; 
            flex-shrink: 0; 
        }
        .song-details-wrap { flex: 1; min-width: 0; }
        .song-name-main { font-size: 1.05rem; font-weight: 800; color: var(--text-primary); line-height: 1.3; }
        .song-name-ml { font-size: 0.95rem; color: var(--accent-primary); margin-top: 2px; font-weight: 600; }
        .song-tags-row { display: flex; gap: 6px; margin-top: 6px; }
        .song-col-badge { font-size: 0.75rem; font-weight: 700; background: rgba(255, 255, 255, 0.08); color: var(--text-secondary); padding: 3px 8px; border-radius: 6px; }

        .edit-pill-btn { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); padding: 5px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
        .remove-pill-btn { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 5px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
        .suggestion-pill-btn { background: rgba(56, 189, 248, 0.12); color: var(--accent-primary); border: 1px solid var(--badge-border); padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; margin: 2px; }
        .warning-chip { display: inline-block; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); font-size: 0.78rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; margin-top: 10px; }
        .badge-optional { font-size: 0.75rem; background: rgba(255, 255, 255, 0.08); color: var(--text-muted); padding: 3px 8px; border-radius: 6px; font-weight: 700; }
        .smart-suggestions-row { margin-top: 10px; font-size: 0.85rem; color: var(--text-secondary); display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }

    </style>
</head>
<body>
    <div class="ambient-glow-wrap">
        <div class="ambient-sphere ambient-sphere-1"></div>
        <div class="ambient-sphere ambient-sphere-2"></div>
    </div>


    <div class="container">
            <div class="app-header-row">
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <a href="admin.html" class="btn-top-nav"><span>←</span> Admin Portal</a>
            <a href="../index.html" class="btn-top-nav"><span>🏠</span> Holy Hymns</a>
        </div>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn" title="Toggle Dark/Light Mode">🌙</button>
    </div>
        <h1>🎵 Worship Service Planner</h1>
        <p class="subtitle">Generate random song selections for Sunday worship</p>
        
        <!-- Auth Section -->
        <div id="authSection" style="background: #fff3cd; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #ffc107;">
            <span style="color: #856404; font-weight: 600;">🔒 Sign in to create or edit services</span>
            <button onclick="signInWithGoogle()" style="background: white; border: 2px solid #e2e8f0; padding: 8px 16px;
                margin-left: 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
                color: #2d3748; display: inline-flex; align-items: center; gap: 8px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
                Sign in with Google
            </button>
            <p style="margin-top: 6px; font-size: 12px; color: #856404;">💡 You can view service history without signing in.</p>
            <p id="authMessage" style="color: #e53e3e; margin-top: 4px; font-size: 12px;"></p>
        </div>
        <div id="authInfo" style="display: none; background: #d4edda; padding: 12px 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #28a745;"></div>

        <div class="service-info" style="background: #f7fafc; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #2d3748;">📅 Service Date</label>
                    <input type="date" id="serviceDate" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px;" />
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #2d3748;">📖 Theme of the Week</label>
                    <input type="text" id="serviceTheme" placeholder="Enter theme..." style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px;" />
                </div>
            </div>
            <div id="syncStatus" style="margin-top: 10px; font-size: 12px; color: #6c757d;"></div>
        </div>

                <div class="controls-toolbar">
            <button id="btnGenerate" class="action-btn primary-btn" onclick="generateService()" disabled>
                <span>🎲</span> Generate Service
            </button>
            <button id="btnSave" class="action-btn save-btn" onclick="saveService()" disabled>
                <span>💾</span> Save Service
            </button>
            <button class="action-btn whatsapp-btn" onclick="shareToWhatsApp()">
                <span>💬</span> WhatsApp
            </button>
            <button class="action-btn history-btn" onclick="showHistory()">
                <span>📜</span> History
            </button>
            <button class="action-btn print-btn" onclick="window.print()">
                <span>🖨️</span> Print
            </button>
            <button id="btnSync" class="action-btn sync-btn" onclick="manualSync()" disabled>
                <span>🔄</span> Sync
            </button>
            <div class="convention-select-wrap">
                <label>Offertory:</label>
                <select id="offertoryConvention">
                    <option value="alternate">Alternate Conventions</option>
                    <option value="maramon-2026">Maramon 2026</option>
                    <option value="maramon-2025">Maramon 2025</option>
                    <option value="kottarakara-2026">Kottarakara 2026</option>
                    <option value="kottarakara-2025">Kottarakara 2025</option>
                </select>
            </div>
        </div>
        <div id="serviceOrder"></div>
        
        <div class="recently-used" id="recentlyUsed"></div>
    </div>

    <!-- Unconfirmed History Check Modal -->
    <div id="unconfirmedModal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width:480px;">
            <div class="modal-header">
                <h2>🎵 Song History Check</h2>
                <span class="close-btn" onclick="closeUnconfirmedModal()">&times;</span>
            </div>
            <div id="unconfirmedModalBody"></div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📜 Service History</h2>
                <span class="close-btn" onclick="closeHistory()">&times;</span>
            </div>
            
            <div class="filter-section">
                <label><strong>Search by Song Number:</strong></label><br/>
                <input type="text" id="searchSongNum" placeholder="Enter song number (e.g., 25 or DOX-I)" style="width: 200px;" />
                <button onclick="searchBySong()">🔍 Search Song</button>
                <button onclick="clearSearch()">Clear</button>
            </div>
            
            <div class="filter-section">
                <label><strong>Filter by Date Range:</strong></label><br/>
                <input type="date" id="filterStartDate" placeholder="Start Date" />
                <input type="date" id="filterEndDate" placeholder="End Date" />
                <button onclick="filterHistory()">🔍 Filter</button>
                <button onclick="clearFilter()">Clear</button>
            </div>
            
            <div id="historyList"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    import { firebaseConfig, ALLOWED_ADMINS } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window._db = db;
    window._auth = auth;

    function setWriteButtonsEnabled(enabled) {
        ['btnGenerate', 'btnSave', 'btnSync'].forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.disabled = !enabled;
            btn.style.opacity = enabled ? '1' : '0.45';
            btn.style.cursor = enabled ? 'pointer' : 'not-allowed';
        });
    }

    onAuthStateChanged(auth, async (user) => {
        if (user && ALLOWED_ADMINS.includes(user.email)) {
            isAuthenticated = true;
            currentUser = user.email;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('authInfo').style.display = 'block';
            document.getElementById('authInfo').innerHTML = `
                <span style="color:#155724; font-weight:600;">Welcome ${user.displayName}</span>
                <button onclick="window._auth.signOut()" style="background:#dc3545; color:white; padding:6px 12px;
                margin-left:12px; border:none; border-radius:5px; cursor:pointer; font-size:12px;">Sign Out</button>
            `;
            setWriteButtonsEnabled(true);
            await loadFromFirestore();
        } else if (user) {
            signOut(auth);
            document.getElementById('authMessage').textContent =
                `❌ ${user.email} is not an authorized admin.`;
        } else {
            isAuthenticated = false;
            currentUser = null;
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('authInfo').style.display = 'none';
            setWriteButtonsEnabled(false);
            // Load history publicly so anyone can view it
            await loadFromFirestore();
        }
    });

    window.signInWithGoogle = async function() {
        const provider = new GoogleAuthProvider();
        try {
            await signInWithPopup(auth, provider);
        } catch(err) {
            document.getElementById('authMessage').textContent = 'Sign-in failed: ' + err.message;
        }
    };

    // Load full service history from Firestore
    window.loadFromFirestore = async function() {
        try {
            updateSyncStatus('⬇️ Loading from cloud...');
            const snapshot = await getDocs(collection(db, 'worshipHistory'));
            const loaded = [];
            snapshot.forEach(docSnap => loaded.push(docSnap.data()));
            // Sort by date descending — no cap, Firestore supports full history
            serviceHistory = loaded
                .sort((a, b) => b.date - a.date);
            localStorage.setItem('serviceHistory', JSON.stringify(serviceHistory));
            displayRecentlyUsed();
            updateSyncStatus(`✅ Loaded ${serviceHistory.length} services from cloud`);
            setTimeout(() => updateSyncStatus(''), 3000);
        } catch(err) {
            console.error('Firestore load error:', err);
            updateSyncStatus('⚠️ Cloud load failed — using local data');
            setTimeout(() => updateSyncStatus(''), 4000);
        }
    };

    // Save a single service to Firestore (document ID = date timestamp as string)
    window.saveToFirestore = async function(service) {
        if (!isAuthenticated) return false;
        try {
            const docId = String(service.date);
            await setDoc(doc(db, 'worshipHistory', docId), service);
            return true;
        } catch(err) {
            console.error('Firestore save error:', err);
            return false;
        }
    };

    // Delete a single service from Firestore by date timestamp
    window.deleteFromFirestore = async function(dateTimestamp) {
        if (!isAuthenticated) return false;
        try {
            await deleteDoc(doc(db, 'worshipHistory', String(dateTimestamp)));
            return true;
        } catch(err) {
            console.error('Firestore delete error:', err);
            return false;
        }
    };

        async function loadData() {

        async function manualSync() {
            if (!isAuthenticated) {
                alert('🔒 Please sign in with Google to sync changes to the cloud.');

        function checkUnconfirmedHistory(songNum, category) {
            const twoMonthsAgo = Date.now() - (60 * 24 * 60 * 60 * 1000);
            const today = Date.now();

            // Find past services (date already passed) that are unconfirmed and contain this song
            const pending = serviceHistory.filter(service =>
                service.confirmed !== true &&
                service.date < today &&
                service.date > twoMonthsAgo &&
                service.songs.some(s => s.number === songNum && s.category === category)
            );

            if (pending.length === 0) return;

            const dateList = pending.map(service => {
                const d = new Date(service.date).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                return `<div style="background:#f7fafc; border-left:3px solid #b87333; padding:8px 12px; border-radius:6px; margin-bottom:8px;">
                    📅 <strong>${d}</strong>
                    <div style="font-size:12px; color:#6c757d; margin-top:3px;">Theme: ${service.theme || '—'}</div>
                </div>`;
            }).join('');

            document.getElementById('unconfirmedModalBody').innerHTML = `
                <p style="margin-bottom:14px; color:#2d3748;">
                    Song <strong>#${songNum}</strong> was planned on the following date(s) within the last 2 months but hasn't been confirmed as sung:
                </p>
                ${dateList}
                <p style="margin-bottom:16px; color:#2d3748;">Was this song actually sung on ${pending.length === 1 ? 'that date' : 'any of those dates'}?</p>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button onclick="confirmSongSung(${JSON.stringify(pending.map(s => s.date))})" style="background:#38a169; flex:1; min-width:120px;">✅ Yes, mark as sung</button>
                    <button onclick="closeUnconfirmedModal()" style="background:#718096; flex:1; min-width:120px;">✖️ No / Not sure</button>
                </div>
            `;
            document.getElementById('unconfirmedModal').style.display = 'block';
        }

        function confirmSongSung(dates) {
            dates.forEach(date => {
                const idx = serviceHistory.findIndex(s => s.date === date);
                if (idx === -1) return;
                serviceHistory[idx].confirmed = true;
                localStorage.setItem('serviceHistory', JSON.stringify(serviceHistory));
                if (isAuthenticated) saveToFirestore(serviceHistory[idx]);
            });
            closeUnconfirmedModal();
            // Re-render so the ⚠️ warning appears immediately on the current plan
            if (window.currentService) displayService(window.currentService);
        }

        function closeUnconfirmedModal() {
            document.getElementById('unconfirmedModal').style.display = 'none';
        }

        function wasRecentlyUsed(songNum, category) {
            const twoMonthsAgo = Date.now() - (60 * 24 * 60 * 60 * 1000);

            // Exclude the service currently being edited
            const editingDate = window.editingServiceIndex !== undefined
                ? serviceHistory[window.editingServiceIndex]?.date
                : undefined;

            // Any saved service (confirmed or not) counts — confirmed check was
            // preventing warnings for services saved before being marked as sung
            return serviceHistory.some(service =>
                service.confirmed !== false &&
                service.date !== editingDate &&
                service.date > twoMonthsAgo &&
                service.songs.some(s => s.number === songNum && s.category === category)
            );
        }

        function getFrequentSongs(category, count = 5) {
            // Only count confirmed (actually sung) services
            const categoryHistory = serviceHistory
                .filter(s => s.confirmed === true)
                .flatMap(s => s.songs.filter(song => song.category === category))
                .map(s => s.number);
            
            if (categoryHistory.length === 0) return [];
            
            // Count frequency
            const frequency = {};
            categoryHistory.forEach(num => {
                frequency[num] = (frequency[num] || 0) + 1;
            });
            
            // Return top picks (not recently used)
            return Object.entries(frequency)
                .sort((a, b) => b[1] - a[1])
                .map(([num]) => isNaN(num) ? num : parseInt(num))
                .filter(num => !wasRecentlyUsed(num, category))
                .slice(0, count);
        }

        function getRandomSong(numbers, category) {
            // First try frequent picks from history
            const frequentPicks = getFrequentSongs(category, 3);
            const validFrequent = frequentPicks.filter(num => numbers.includes(num));
            
            if (validFrequent.length > 0 && Math.random() > 0.3) {
                // 70% chance to use a frequent pick
                const num = validFrequent[Math.floor(Math.random() * validFrequent.length)];
                return hymns.find(s => s.number === num);
            }
            
            // Otherwise pick randomly from available songs
            let availableSongs = numbers.filter(num => !wasRecentlyUsed(num, category));
            if (availableSongs.length === 0) availableSongs = numbers;
            
            const num = availableSongs[Math.floor(Math.random() * availableSongs.length)];
            return hymns.find(s => s.number === num) || hymns[Math.floor(Math.random() * hymns.length)];
        }

        function getRandomConventionSong(collection) {
            const songs = conventions[collection];
            
            // Check history for frequently used offertory songs from this collection
            const frequentPicks = getFrequentSongs('offertory', 5);
            const validFrequent = songs.filter(s => frequentPicks.includes(s.number));
            
            if (validFrequent.length > 0 && Math.random() > 0.3) {
                return validFrequent[Math.floor(Math.random() * validFrequent.length)];
            }
            
            let availableSongs = songs.filter(s => !wasRecentlyUsed(s.number, 'offertory'));
            if (availableSongs.length === 0) availableSongs = songs;
            
            return availableSongs[Math.floor(Math.random() * availableSongs.length)];
        }

        function getRandomCelebrationSong() {
            if (celebrationSongs.length === 0) return null;
            
            // Only use confirmed services for frequency and recency
            const confirmedHistory = serviceHistory.filter(s => s.confirmed === true);

            const usedSongs = confirmedHistory
                .flatMap(s => s.songs.filter(song => song.category === 'celebration'))
                .map(s => s.number);
            
            const frequency = {};
            usedSongs.forEach(num => {
                frequency[num] = (frequency[num] || 0) + 1;
            });
            
            const twoMonthsAgo = Date.now() - (60 * 24 * 60 * 60 * 1000);
            const recentlyUsed = confirmedHistory
                .filter(s => s.date > twoMonthsAgo)
                .flatMap(s => s.songs.filter(song => song.category === 'celebration'))
                .map(s => s.number);
            
            const availableSongs = celebrationSongs.filter(s => !recentlyUsed.includes(s.number));
            const songsToChooseFrom = availableSongs.length > 0 ? availableSongs : celebrationSongs;
            
            if (Math.random() < 0.7 && Object.keys(frequency).length > 0) {
                const frequentSongs = Object.entries(frequency)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(([num]) => isNaN(num) ? num : parseInt(num));
                
                const frequentAvailable = songsToChooseFrom.filter(s => frequentSongs.includes(s.number));
                if (frequentAvailable.length > 0) {
                    return frequentAvailable[Math.floor(Math.random() * frequentAvailable.length)];
                }
            }
            
            return songsToChooseFrom[Math.floor(Math.random() * songsToChooseFrom.length)];
        }

        function getDoxology() {
            const doxSongs = hymns.filter(s => typeof s.number === 'string' && s.number.startsWith('DOX'));
            
            // Check for frequently used doxology
            const frequentPicks = getFrequentSongs('doxology', 3);
            const validFrequent = doxSongs.filter(s => frequentPicks.includes(s.number));
            
            if (validFrequent.length > 0 && Math.random() > 0.3) {
                return validFrequent[Math.floor(Math.random() * validFrequent.length)];
            }
            
            let availableSongs = doxSongs.filter(s => !wasRecentlyUsed(s.number, 'doxology'));
            if (availableSongs.length === 0) availableSongs = doxSongs;
            
            return availableSongs[Math.floor(Math.random() * availableSongs.length)];
        }

        function reconstructServiceFromHistory(service, existingIndex) {
            const categoryTitles = {
                'opening':     '1. Opening Hymn',
                'bibleReading':'2. Song for Bible Reading',
                'celebration': '3. Birthday/Anniversary Song',
                'offertory':   '4. Offertory Song',
                'qurbana1':    '5. Holy Qurbana - Song 1',
                'qurbana2':    '6. Holy Qurbana - Song 2',
                'qurbana3':    '7. Holy Qurbana - Song 3 (Optional)',
                'doxology':    '8. Doxology'
            };

            window.currentService = service.songs.map(savedSong => {
                let song, collection;

                if (savedSong.category === 'celebration') {
                    song = celebrationSongs.find(s => s.number == savedSong.number);
                    collection = 'Birthday/Anniversary';
                    if (!song) { song = hymns.find(s => s.number == savedSong.number); collection = 'Kristheeya Keerthanangal'; }
                    if (!song) {
                        for (const [collName, songs] of Object.entries(conventions)) {
                            song = songs.find(s => s.number == savedSong.number);
                            if (song) { collection = collName; break; }
                        }
                    }
                } else if (savedSong.category === 'offertory') {
                    for (const [collName, songs] of Object.entries(conventions)) {
                        song = songs.find(s => s.number == savedSong.number);
                        if (song) { collection = collName; break; }
                    }
                    if (!song) { song = hymns.find(s => s.number == savedSong.number); collection = 'Kristheeya Keerthanangal'; }
                } else if (savedSong.category === 'doxology') {
                    song = hymns.find(s => s.number == savedSong.number);
                    collection = 'Doxology';
                } else {
                    song = hymns.find(s => s.number == savedSong.number);
                    collection = 'Kristheeya Keerthanangal';
                }

                if (!song) {
                    song = { number: savedSong.number, name: savedSong.name, name2: '', youtubeId: '' };
                    collection = savedSong.collection || 'Unknown';
                }

                const isOptional = savedSong.category === 'qurbana3';
                return {
                    title: categoryTitles[savedSong.category] || savedSong.category,
                    song: song,
                    collection: collection,
                    category: savedSong.category,
                    ...(isOptional && { optional: true })
                };
            });

            document.getElementById('serviceTheme').value = service.theme || '';
            window.editingServiceIndex = existingIndex;
            displayService(window.currentService);
        }

        function generateService() {
            // If a date is selected, check history before generating new songs
            const selectedDateStr = document.getElementById('serviceDate').value;
            if (selectedDateStr) {
                const selectedTimestamp = new Date(selectedDateStr).getTime();
                const existingIndex = serviceHistory.findIndex(s => s.date === selectedTimestamp);
                if (existingIndex !== -1) {
                    reconstructServiceFromHistory(serviceHistory[existingIndex], existingIndex);
                    const dateLabel = new Date(selectedTimestamp).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                    const banner = document.createElement('div');
                    banner.style.cssText = 'background:#ebf8ff;border:1px solid #90cdf4;border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#2b6cb0;';
                    banner.textContent = `📋 Loaded existing service for ${dateLabel}`;
                    const order = document.getElementById('serviceOrder');
                    order.insertBefore(banner, order.firstChild);
                    setTimeout(() => banner.remove(), 4000);
                    return;
                }
            }

            const offertoryPref = document.getElementById('offertoryConvention').value;

            let offertoryConvention;
            if (offertoryPref === 'alternate') {
                const year = new Date().getFullYear();
                // Determine last used convention from saved history so alternation
                // survives page reloads and sessions
                const lastSaved = serviceHistory
                    .flatMap(s => s.songs)
                    .find(s => s.category === 'offertory' && s.collection);
                if (lastSaved) {
                    lastConvention = lastSaved.collection.startsWith('maramon') ? 'maramon' : 'kottarakara';
                }
                lastConvention = lastConvention === 'kottarakara' ? 'maramon' : 'kottarakara';
                offertoryConvention = `${lastConvention}-${year}`;
                if (!conventions[offertoryConvention]) {
                    offertoryConvention = `${lastConvention}-2025`;
                }
            } else {
                offertoryConvention = offertoryPref;
            }

            window.currentService = [
                { title: '1. Opening Hymn', song: getRandomSong(categories.opening, 'opening'), collection: 'Kristheeya Keerthanangal', category: 'opening' },
                { title: '2. Song for Bible Reading', song: getRandomSong(categories.bibleReading, 'bibleReading'), collection: 'Kristheeya Keerthanangal', category: 'bibleReading' },
                { title: '3. Birthday/Anniversary Song', song: getRandomCelebrationSong(), collection: 'Birthday/Anniversary', category: 'celebration' },
                { title: '4. Offertory Song', song: getRandomConventionSong(offertoryConvention), collection: offertoryConvention, category: 'offertory' },
                { title: '5. Holy Qurbana - Song 1', song: getRandomSong(categories.qurbana, 'qurbana1'), collection: 'Kristheeya Keerthanangal', category: 'qurbana1' },
                { title: '6. Holy Qurbana - Song 2', song: getRandomSong(categories.qurbana, 'qurbana2'), collection: 'Kristheeya Keerthanangal', category: 'qurbana2' },
                { title: '7. Holy Qurbana - Song 3 (Optional)', song: null, collection: 'Kristheeya Keerthanangal', category: 'qurbana3', optional: true },
                { title: '8. Doxology', song: getDoxology(), collection: 'Doxology', category: 'doxology' }
            ];

            displayService(window.currentService);
        }

        function getSuggestedCelebrationSongs() {
            // Analyze history to find patterns
            const celebrationHistory = serviceHistory
                .flatMap(s => s.songs.filter(song => song.category === 'celebration'))
                .map(s => s.number);
            
            if (celebrationHistory.length === 0) {
                // Default suggestions from both hymns and conventions
                return [200, 205, 210, 215, 220, 225, 230, 235, 240, 245, 250];
            }
            
            // Count frequency
            const frequency = {};
            celebrationHistory.forEach(num => {
                frequency[num] = (frequency[num] || 0) + 1;
            });
            
            // Get top picks
            const topPicks = Object.entries(frequency)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([num]) => isNaN(num) ? num : parseInt(num));
            
            // Find similar range songs (not recently used) from hymns
            const numericHistory = celebrationHistory.filter(n => !isNaN(n));
            const avgNum = numericHistory.length > 0 ? 
                numericHistory.reduce((a, b) => a + b, 0) / numericHistory.length : 200;
            
            const rangeSongs = hymns
                .filter(s => typeof s.number === 'number' && 
                            Math.abs(s.number - avgNum) < 50 &&
                            !wasRecentlyUsed(s.number, 'celebration'))
                .map(s => s.number)
                .slice(0, 3);
            
            // Add some convention songs
            const conventionSuggestions = Object.values(conventions)
                .flat()
                .filter(s => !wasRecentlyUsed(s.number, 'celebration'))
                .slice(0, 2)
                .map(s => s.number);
            
            return [...new Set([...topPicks, ...rangeSongs, ...conventionSuggestions])].slice(0, 8);
        }

        function setManualSong(index, songNum) {
            // Check birthday/anniversary collection first
            let song = celebrationSongs.find(s => s.number == songNum);
            // If not found and input is numeric, try with "SS" prefix
            if (!song && !isNaN(songNum)) {
                song = celebrationSongs.find(s => s.number == `SS${songNum}`);
            }
            let collection = 'Birthday/Anniversary';
            
            // Then check hymns
            if (!song) {
                song = hymns.find(s => s.number == songNum);
                collection = 'Kristheeya Keerthanangal';
            }
            
            // If not found, search in all conventions
            if (!song) {
                for (const [collName, songs] of Object.entries(conventions)) {
                    song = songs.find(s => s.number == songNum);
                    if (song) {
                        collection = collName;
                        break;
                    }
                }
            }
            
            if (song) {
                window.currentService[index].song = song;
                window.currentService[index].collection = collection;
                displayService(window.currentService);
                checkUnconfirmedHistory(song.number, window.currentService[index].category);
            } else {
                const customName = prompt(
                    `Song #${songNum} not found in any collection.\n\n` +
                    `Enter song name to add as a custom entry (or Cancel to skip):`
                );
                if (customName && customName.trim()) {
                    const customSong = { number: songNum, name: customName.trim(), name2: '', youtubeId: '' };
                    window.currentService[index].song = customSong;
                    window.currentService[index].collection = 'Custom';
                    displayService(window.currentService);
                }
            }
        }

        function setManualSongWithCollection(index) {
            const collectionSelect = document.getElementById(`celebrationCollection${index}`);
            const songNumInput = document.getElementById(`manual${index}`);
            
            const selectedCollection = collectionSelect.value;
            const songNum = songNumInput.value;
            
            if (!songNum) {
                alert('Please enter a song number!');
                return;
            }
            
            let song;
            if (selectedCollection === 'birthday-anniversary') {
                song = celebrationSongs.find(s => s.number == songNum);
                // If not found and input is numeric, try with "SS" prefix
                if (!song && !isNaN(songNum)) {
                    song = celebrationSongs.find(s => s.number == `SS${songNum}`);
                }
            } else if (selectedCollection === 'kristheeya-keerthanangal') {
                song = hymns.find(s => s.number == songNum);
            } else {
                song = conventions[selectedCollection].find(s => s.number == songNum);
            }
            
            if (song) {
                window.currentService[index].song = song;
                window.currentService[index].collection = selectedCollection === 'birthday-anniversary' ?
                    'Birthday/Anniversary' :
                    selectedCollection === 'kristheeya-keerthanangal' ?
                    'Kristheeya Keerthanangal' :
                    selectedCollection;
                displayService(window.currentService);
                checkUnconfirmedHistory(song.number, window.currentService[index].category);
            } else {
                // Song not found - offer to create custom entry
                const customName = prompt(
                    `Song #${songNum} not found in ${selectedCollection}.\n\n` +
                    `Would you like to add it manually?\n\n` +
                    `Enter song name (or click Cancel to try again):`
                );

                if (customName && customName.trim()) {
                    // Create custom song object
                    const customSong = {
                        number: songNum,
                        name: customName.trim(),
                        name2: '',
                        youtubeId: ''
                    };

                    window.currentService[index].song = customSong;
                    window.currentService[index].collection = selectedCollection === 'birthday-anniversary' ?
                        'Birthday/Anniversary' :
                        selectedCollection === 'kristheeya-keerthanangal' ?
                        'Kristheeya Keerthanangal' :
                        selectedCollection;
                    displayService(window.currentService);
                    
                    alert('✅ Custom song added!\n\nNote: This is a temporary entry and won\'t be added to the collection permanently.');
                }
            }
        }

        function setOptionalSong(index) {
            const songNum = document.getElementById(`optional${index}`).value;
            
            if (!songNum) {
                alert('Please enter a song number!');
                return;
            }
            
            const song = hymns.find(s => s.number == songNum);
            
            if (song) {
                window.currentService[index].song = song;
                displayService(window.currentService);
                checkUnconfirmedHistory(song.number, window.currentService[index].category);
            } else {
                const customName = prompt(
                    `Song #${songNum} not found in Kristheeya Keerthanangal.\n\n` +
                    `Enter song name to add as a custom entry (or Cancel to skip):`
                );

                } else {

                    const customName = prompt(
                        `Song #${songNum} not found in ${collectionLabel}.\n\n` +

                    );
                    if (customName && customName.trim()) {

                        window.currentService[index].song = customSong;
                        window.currentService[index].collection = collectionLabel;
                        displayService(window.currentService);
                    }
                }
                return;
            }

            // Special handling for Doxology - convert number to DOX-Roman
            if (item.category === 'doxology') {
                const input = prompt(
                    `Current: ${currentSong.number} - ${currentSong.name}\n\n` +
                    `Enter doxology number:\n` +
                    `- Type number (1-13) for DOX-I to DOX-XIII\n` +
                    `- Or type full name (e.g., DOX-V):`
                );
                
                if (!input) return;
                
                let doxNumber;
                if (/^\d+$/.test(input)) {
                    // Convert number to Roman
                    const romanMap = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII'];
                    const num = parseInt(input);
                    if (num >= 1 && num <= 13) {
                        doxNumber = `DOX-${romanMap[num]}`;
                    }
                } else {
                    doxNumber = input.toUpperCase();
                }
                
                if (doxNumber) {
                    const song = hymns.find(s => s.number === doxNumber);
                    if (song) {
                        window.currentService[index].song = song;
                        displayService(window.currentService);
                        checkUnconfirmedHistory(song.number, 'doxology');

                    alert('Invalid doxology number!');

            // Birthday/Anniversary - search all collections

                    `Enter song number:\n` +

                    `- From any Convention (e.g., 13, 80):\n\n` +
                    `Note: System will search all collections`
                );
                
                if (!input) return;
                
                // Search in hymns first
                let song = hymns.find(s => s.number == input);
                let collection = 'Kristheeya Keerthanangal';
                
                // If not found, search all conventions
                if (!song) {
                    for (const [collName, songs] of Object.entries(conventions)) {
                        song = songs.find(s => s.number == input);
                        if (song) {
                            collection = collName;

                    window.currentService[index].collection = collection;

                    checkUnconfirmedHistory(song.number, 'celebration');

            const newNum = prompt(`Current: #${currentSong.number} - ${currentSong.name}\n\nEnter new song number:`);

            }

        function populateTheme(dateStr) {
            if (!dateStr) return;
            
            const selectedDate = new Date(dateStr);
            const year = selectedDate.getFullYear().toString();
            
            if (!weeklyThemes[year]) {
                document.getElementById('serviceTheme').value = '';
                return;
            }
            
            const themes = weeklyThemes[year];
            let matchedTheme = '';
            
            // First, check for exact date match (holidays, special services)
            const exactMatch = themes.exact.find(t => t.date === dateStr);
            if (exactMatch) {
                document.getElementById('serviceTheme').value = exactMatch.theme;
                return;
            }
            
            // Then check weekly themes
            for (let i = 0; i < themes.weekly.length; i++) {
                const weekStart = new Date(themes.weekly[i].start);
                const weekEnd = new Date(weekStart);
                weekEnd.setDate(weekEnd.getDate() + 6);
                
                if (selectedDate >= weekStart && selectedDate <= weekEnd) {
                    matchedTheme = themes.weekly[i].theme;
                    break;
                }
            }
            
            document.getElementById('serviceTheme').value = matchedTheme;
        }

                        <button onclick="shareServiceFromHistory(${originalIndex})" class="whatsapp-btn" style="padding: 6px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>Share</button>
                    </div>
                ` : isAuthenticated ? `
                    <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                        <button onclick="markAsSung(${originalIndex})" style="padding: 6px 12px; font-size: 12px; background: #38a169;">✅ Mark as Sung</button>
                        <button onclick="shareServiceFromHistory(${originalIndex})" class="whatsapp-btn" style="padding: 6px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>Share</button>
                    </div>
                ` : `
                    <div style="display: flex; gap: 5px; flex-wrap: wrap; align-items: center;">
                        ${isSung ? '<span style="font-size: 12px; color: #38a169; font-weight: 600;">✅ Sung</span>' : ''}
                        <button onclick="shareServiceFromHistory(${originalIndex})" class="whatsapp-btn" style="padding: 6px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>Share</button>
                    </div>
                `;
                
                return `
                    <div class="history-item" style="border-left-color: ${isSung ? '#38a169' : '#b87333'};">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                            <div>
                                <div class="history-date">📅 ${date}</div>
                                <div class="history-theme">📖 Theme: ${theme}</div>
                            </div>
                            ${actionButtons}
                        </div>
                        <div class="history-songs">${songsHtml}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('historyList').innerHTML = html;
        }

        function loadServiceForEdit(index) {
            if (index < 0 || index >= serviceHistory.length) {
                alert('Service not found!');
                return;
            }

            const service = serviceHistory[index];
            const date = new Date(service.date).toLocaleDateString();
            if (!confirm(`Load service from ${date} for editing?\n\nThis will replace your current service plan.`)) {
                return;
            }

            document.getElementById('serviceDate').value = new Date(service.date).toISOString().split('T')[0];
            reconstructServiceFromHistory(service, index);
            closeHistory();
            alert('✏️ Service loaded for editing!\n\nMake your changes and click "Save Service" to update.');
        }

        function markAsSung(index) {
            if (index < 0 || index >= serviceHistory.length) return;
            serviceHistory[index].confirmed = true;
            localStorage.setItem('serviceHistory', JSON.stringify(serviceHistory));
            if (isAuthenticated) saveToFirestore(serviceHistory[index]);
            displayFullHistory();
        }

        function unmarkAsSung(index) {
            if (index < 0 || index >= serviceHistory.length) return;
            serviceHistory[index].confirmed = false;
            localStorage.setItem('serviceHistory', JSON.stringify(serviceHistory));
            if (isAuthenticated) saveToFirestore(serviceHistory[index]);
            displayFullHistory();
        }

        function deleteService(index) {
            if (index < 0 || index >= serviceHistory.length) {
                alert('Service not found!');
                return;
            }
            
            const service = serviceHistory[index];
            const date = new Date(service.date).toLocaleDateString();
            
            if (!confirm(`Delete service from ${date}?\n\nThis cannot be undone.`)) {
                return;
            }
            
            const deletedDate = service.date;
            serviceHistory.splice(index, 1);
            localStorage.setItem('serviceHistory', JSON.stringify(serviceHistory));

            if (isAuthenticated) deleteFromFirestore(deletedDate);
            
            alert('✅ Service deleted!');
            displayFullHistory();
            displayRecentlyUsed();
        }

        function shareServiceFromHistory(index) {
            if (index < 0 || index >= serviceHistory.length) {
                alert('Service not found!');
                return;
            }
            
            const service = serviceHistory[index];
            const date = new Date(service.date).toLocaleDateString('en-US', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
            const theme = service.theme || 'No theme';
            
            const categoryBaseNames = {
                'opening': 'Opening Hymn',
                'bibleReading': 'Bible Reading',
                'celebration': 'Birthday/Anniversary',
                'offertory': 'Offertory',
                'qurbana1': 'Holy Qurbana - Song 1',
                'qurbana2': 'Holy Qurbana - Song 2',
                'qurbana3': 'Holy Qurbana - Song 3',
                'doxology': 'Doxology'
            };

            let message = `*WORSHIP SERVICE SONGS*\n\n`;
            message += `Date: ${date}\n`;
            message += `Theme: ${theme}\n\n`;
            message += `------------------------\n\n`;

            service.songs.forEach((song, i) => {
                const title = `${i + 1}. ${categoryBaseNames[song.category] || song.category}`;
                message += `${title}\n`;
                message += `#${song.number} - ${song.name}\n`;
                
                // Add collection info for Birthday/Anniversary and Offertory
                if ((song.category === 'celebration' || song.category === 'offertory') && song.collection) {
                    const collectionDisplay = song.collection === 'Kristheeya Keerthanangal' ? 
                        'Kristheeya Keerthanangal' : 
                        song.collection.replace('maramon-', 'Maramon ').replace('kottarakara-', 'Kottarakara ');
                    message += `(${collectionDisplay})\n`;
                }
                message += `\n`;
            });

            message += `------------------------\n`;
            message += `Let us worship together in spirit and truth\n\n`;
            message += `For all song videos and lyrics, please visit https://shibinj.github.io/Hymn_project/`;

            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        function filterHistory() {
            const startDate = document.getElementById('filterStartDate').value;
            const endDate = document.getElementById('filterEndDate').value;
            
            if (!startDate && !endDate) {
                displayFullHistory();
                return;
            }
            
            const start = startDate ? new Date(startDate).getTime() : 0;
            const end = endDate ? new Date(endDate).getTime() + (24 * 60 * 60 * 1000) : Date.now();
            
            const filtered = serviceHistory.filter(service => 
                service.date >= start && service.date <= end
            );
            
            displayFullHistory(filtered);
        }

        function clearFilter() {
            document.getElementById('filterStartDate').value = '';
            document.getElementById('filterEndDate').value = '';
            displayFullHistory();
        }

        function searchBySong() {
            const songNum = document.getElementById('searchSongNum').value.trim();
            
            if (!songNum) {
                alert('Please enter a song number');
                return;
            }
            
            // Handle Doxology search - convert number to DOX-Roman
            let searchNumbers = [songNum];
            if (/^\d+$/.test(songNum)) {
                const num = parseInt(songNum);
                if (num >= 1 && num <= 13) {
                    const romanMap = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII'];
                    searchNumbers.push(`DOX-${romanMap[num]}`);
                }
            }
            
            // Find song in hymns or conventions
            let songInfo = null;
            let collection = '';
            
            for (const searchNum of searchNumbers) {
                songInfo = hymns.find(s => s.number == searchNum);
                if (songInfo) {
                    collection = 'Kristheeya Keerthanangal';
                    break;
                }
                
                for (const [collName, songs] of Object.entries(conventions)) {
                    songInfo = songs.find(s => s.number == searchNum);
                    if (songInfo) {
                        collection = collName;
                        break;
                    }
                }
                if (songInfo) break;
            }
            
            if (!songInfo) {
                document.getElementById('historyList').innerHTML = `<p style="color: #e53e3e;">❌ Song #${songNum} not found in any collection.</p>`;
                return;
            }
            
            // Find all services that used this song (check all search numbers)
            const servicesWithSong = serviceHistory.filter(service => 
                service.songs.some(s => searchNumbers.includes(s.number.toString()))
            ).slice(0, 5); // Last 5 uses
            
            if (servicesWithSong.length === 0) {
                document.getElementById('historyList').innerHTML = `
                    <div style="background: #f7fafc; padding: 20px; border-radius: 8px;">
                        <h3 style="color: #2d3748;">🎵 Song #${songInfo.number} - ${songInfo.name}</h3>
                        <p style="color: #b87333; margin: 5px 0;"><strong>Collection:</strong> ${collection}</p>
                        <p style="color: #6c757d; margin-top: 15px;">✅ This song has never been used in saved services.</p>
                    </div>
                `;
                return;
            }
            
            const categoryTitles = {
                'opening': 'Opening',
                'bibleReading': 'Bible Reading',
                'celebration': 'Birthday/Anniversary',
                'offertory': 'Offertory',
                'qurbana1': 'Qurbana 1',
                'qurbana2': 'Qurbana 2',
                'qurbana3': 'Qurbana 3',
                'doxology': 'Doxology'
            };
            
            const usageHtml = servicesWithSong.map(service => {
                const date = new Date(service.date).toLocaleDateString('en-US', { 
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
                });
                const theme = service.theme || 'No theme';
                const songUsage = service.songs.find(s => searchNumbers.includes(s.number.toString()));
                const category = categoryTitles[songUsage.category] || songUsage.category;
                
                return `
                    <div class="history-item">
                        <div class="history-date">📅 ${date}</div>
                        <div class="history-theme">📖 Theme: ${theme}</div>
                        <div style="margin-top: 10px; color: #b87333; font-weight: 600;">Used as: ${category}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('historyList').innerHTML = `
                <div style="background: #f7fafc; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                    <h3 style="color: #2d3748;">🎵 Song #${songInfo.number} - ${songInfo.name}</h3>
                    ${songInfo.name2 ? `<p style="color: #6c757d;">${songInfo.name2}</p>` : ''}
                    <p style="color: #b87333; margin: 5px 0;"><strong>Collection:</strong> ${collection}</p>
                    <p style="color: #6c757d; margin-top: 10px;">Used ${servicesWithSong.length} time(s) in last ${serviceHistory.length} services</p>
                </div>
                <h3 style="margin-bottom: 15px;">Last ${servicesWithSong.length} Usage(s):</h3>
                ${usageHtml}
            `;
        }

        function clearSearch() {
            document.getElementById('searchSongNum').value = '';
            displayFullHistory();
        }

        function shareToWhatsApp() {
            if (!window.currentService || !window.currentService[2].song) {
                alert('Please complete the service (including Birthday/Anniversary song) before sharing!');
                return;
            }

            const serviceDate = document.getElementById('serviceDate').value;
            const serviceTheme = document.getElementById('serviceTheme').value;

            if (!serviceDate || !serviceTheme) {
                alert('Please enter service date and theme before sharing!');
                return;
            }

            const date = new Date(serviceDate).toLocaleDateString('en-US', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });

            const categoryBaseNames = {
                'opening': 'Opening Hymn',
                'bibleReading': 'Bible Reading',
                'celebration': 'Birthday/Anniversary',
                'offertory': 'Offertory',
                'qurbana1': 'Holy Qurbana - Song 1',
                'qurbana2': 'Holy Qurbana - Song 2',
                'qurbana3': 'Holy Qurbana - Song 3',
                'doxology': 'Doxology'
            };

            let message = `*WORSHIP SERVICE SONGS*\n\n`;
            message += `Date: ${date}\n`;
            message += `Theme: ${serviceTheme}\n\n`;
            message += `------------------------\n\n`;

            // Filter out optional songs that are not set
            const songsToShare = window.currentService.filter(item => item.song !== null);

            songsToShare.forEach((item, i) => {
                const title = `${i + 1}. ${categoryBaseNames[item.category] || item.title}`;
                message += `${title}\n`;
                message += `#${item.song.number} - ${item.song.name}\n`;
                if (item.song.name2) {
                    message += `${item.song.name2}\n`;
                }
                // Add collection info for Birthday/Anniversary and Offertory
                if (item.category === 'celebration' || item.category === 'offertory') {
                    const collectionDisplay = item.collection === 'Kristheeya Keerthanangal' ? 
                        'Kristheeya Keerthanangal' : 
                        item.collection.replace('maramon-', 'Maramon ').replace('kottarakara-', 'Kottarakara ');
                    message += `(${collectionDisplay})\n`;
                }
                message += `\n`;
            });

            message += `------------------------\n`;
            message += `Let us worship together in spirit and truth\n\n`;
            message += `For all song videos and lyrics, please visit https://shibinj.github.io/Hymn_project/`;

            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        function exportHistory() {
            if (serviceHistory.length === 0) {
                alert('No service history to export!');
                return;
            }

            const dataStr = JSON.stringify(serviceHistory, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `worship-service-history-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            
            alert(`✅ Exported ${serviceHistory.length} services!`);
        }

        function importHistory(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if (!Array.isArray(importedData)) {
                        alert('❌ Invalid file format!');
                        return;
                    }

                    // Merge with existing history (avoid duplicates by date)
                    const existingDates = new Set(serviceHistory.map(s => s.date));
                    const newServices = importedData.filter(s => !existingDates.has(s.date));
                    
                    serviceHistory = [...serviceHistory, ...newServices]
                        .sort((a, b) => b.date - a.date);
                    
                    localStorage.setItem('serviceHistory', JSON.stringify(serviceHistory));

                    if (isAuthenticated) {
                        Promise.all(newServices.map(s => saveToFirestore(s))).then(() => {
                            updateSyncStatus(`✅ Imported & synced ${newServices.length} services to cloud`);
                            setTimeout(() => updateSyncStatus(''), 4000);
                        });
                    }

                    alert(`✅ Imported ${newServices.length} new services!\nTotal services: ${serviceHistory.length}`);
                    displayRecentlyUsed();
                } catch (error) {
                    alert('❌ Error reading file: ' + error.message);
                }
            };
            reader.readAsText(file);
            
            // Reset file input
            event.target.value = '';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('historyModal');
            if (event.target === modal) {
                closeHistory();
            }
        };

        loadData().then(() => generateService());
    </script>

<script>
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        setTheme(savedTheme);
    }
    function setTheme(theme) {
        const btn = document.getElementById('themeToggleBtn');
        if (theme === 'light') {
            document.body.classList.add('light-mode');
            if (btn) btn.textContent = '☀️';
            localStorage.setItem('theme', 'light');
        } else {
            document.body.classList.remove('light-mode');
            if (btn) btn.textContent = '🌙';
            localStorage.setItem('theme', 'dark');
        }
    }
    function toggleTheme() {
        const isLight = document.body.classList.contains('light-mode');
        setTheme(isLight ? 'dark' : 'light');
    }
    initTheme();
</script>
