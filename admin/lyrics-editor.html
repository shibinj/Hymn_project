<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hymn Lyrics Editor</title>
        <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">

    <style>
        :root {
            --bg-base: #060913;
            --card-bg: rgba(18, 24, 43, 0.8);
            --card-hover-bg: rgba(28, 38, 68, 0.9);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #c084fc;
            --accent-glow: rgba(192, 132, 252, 0.25);
            --accent-gold: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #c084fc 0%, #ec4899 50%, #f43f5e 100%);
            
            --input-bg: rgba(15, 23, 42, 0.75);
            --input-border: rgba(255, 255, 255, 0.14);
            --input-focus-border: #c084fc;
            
            --section-bg: rgba(255, 255, 255, 0.03);
            --section-border: rgba(255, 255, 255, 0.08);
        }

        body.light-mode {
            --bg-base: #f4f6fb;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-hover-bg: #ffffff;
            --card-border: rgba(203, 213, 225, 0.8);
            --card-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --accent-primary: #9333ea;
            --accent-glow: rgba(147, 51, 234, 0.15);
            --accent-gold: #d97706;
            --accent-gradient: linear-gradient(135deg, #9333ea 0%, #db2777 50%, #e11d48 100%);
            
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-focus-border: #9333ea;
            
            --section-bg: #f8fafc;
            --section-border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: 20px 12px; 
            background: var(--bg-base); 
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
        }

        .ambient-glow-wrap { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .ambient-sphere { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; }
        .ambient-sphere-1 { width: 600px; height: 600px; top: -150px; left: 10%; background: radial-gradient(circle, rgba(192, 132, 252, 0.35) 0%, transparent 70%); }
        .ambient-sphere-2 { width: 650px; height: 650px; top: 30%; right: -200px; background: radial-gradient(circle, rgba(236, 72, 153, 0.3) 0%, transparent 70%); }

        .editor-wrapper { 
            max-width: 1300px; 
            margin: 0 auto; 
            position: relative;
            z-index: 1;
        }

        .app-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .btn-top-nav {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-top-nav:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent-primary);
            transform: translateX(-2px);
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        h1 { color: var(--text-primary); margin-bottom: 12px; font-size: 1.85rem; font-weight: 800; letter-spacing: -0.02em; }
        
        .container {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }

        .hymn-list {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: 20px;
            height: 75vh;
            overflow-y: auto;
            backdrop-filter: blur(16px);
            box-shadow: var(--card-shadow);
        }

        .hymn-item {
            padding: 12px 14px;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 6px;
            transition: all 0.15s ease;
            color: var(--text-primary);
            border: 1px solid transparent;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .hymn-item:hover { background: var(--card-hover-bg); transform: translateX(3px); }
        .hymn-item.active { background: var(--accent-gradient); color: white; box-shadow: 0 4px 14px var(--accent-glow); }
        .hymn-item.has-lyrics { border-left: 4px solid #10b981; }
        .hymn-item.has-draft  { border-left: 4px solid #f59e0b; }
        .hymn-item.no-lyrics  { border-left: 4px solid #ef4444; }

        .editor {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 20px;
            height: 75vh;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(16px);
            box-shadow: var(--card-shadow);
        }

        .editor h2 { margin-bottom: 15px; color: var(--text-primary); font-size: 1.3rem; font-weight: 800; }
        
        textarea {
            flex: 1;
            padding: 16px;
            font-size: 1.05rem;
            font-family: 'Noto Sans Malayalam', 'Courier New', monospace;
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1.5px solid var(--input-border);
            border-radius: 12px;
            resize: none;
            line-height: 2;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: var(--accent-primary); }

        .buttons {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            font-size: 0.88rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        button:hover { transform: translateY(-1px); }

        .save-btn     { background: #10b981; color: white; }
        .save-btn:hover { background: #059669; }
        .download-btn { background: #3b82f6; color: white; }
        .download-btn:hover { background: #2563eb; }
        .clear-btn    { background: #ef4444; color: white; }
        .clear-drafts-btn { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); border: 1px solid var(--card-border); }

        .stats {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            backdrop-filter: blur(12px);
        }

        .stats select {
            padding: 8px 14px;
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1.5px solid var(--input-border);
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-weight: 600;
        }

        .legend { display: flex; gap: 14px; font-size: 0.82rem; color: var(--text-secondary); font-weight: 600; }
        .legend span { display: flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

        .auth-bar {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .auth-bar.signed-in {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.3);
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .hymn-list { height: 320px; }
        }
    </style>

</head>
<body>

    <div class="ambient-glow-wrap">
        <div class="ambient-sphere ambient-sphere-1"></div>
        <div class="ambient-sphere ambient-sphere-2"></div>
    </div>
    <div class="editor-wrapper">
        <div class="app-header-row">
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <a href="admin.html" class="btn-top-nav"><span>←</span> Admin Portal</a>
                <a href="../index.html" class="btn-top-nav"><span>🏠</span> Holy Hymns</a>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn" title="Toggle Dark/Light Mode">🌙</button>
        </div>
    </div>
    <h1>📝 Hymn Lyrics Editor</h1>

    <!-- Auth bar -->
    <div class="auth-bar" id="authBar">
        <span style="color: #856404; font-weight: 600;">🔒 Sign in to save lyrics to the cloud</span>
        <button onclick="signInWithGoogle()" style="background: white; border: 2px solid #e2e8f0; padding: 7px 14px;
            border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
            color: #2d3748; display: inline-flex; align-items: center; gap: 8px;">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" height="16" alt="Google">
            Sign in with Google
        </button>
        <p id="authMessage" style="color: #e53e3e; font-size: 12px; margin: 0;"></p>
    </div>

    <div class="stats">
        <div>
            <label for="collectionSelect"><strong>Collection:</strong></label>
            <select id="collectionSelect" onchange="loadCollection()" style="padding: 5px 10px; margin-left: 10px; border-radius: 5px;">
                <option value="kristheeya-keerthanangal">Kristheeya Keerthanangal</option>
                <option value="birthday-anniversary">Birthday/Anniversary Songs</option>
                <option value="holy-communion">Holy Communion Songs</option>
                <option value="maramon-2006">Maramon Convention 2006</option>
                <option value="maramon-2008">Maramon Convention 2008</option>
                <option value="maramon-2013">Maramon Convention 2013</option>
                <option value="maramon-2021">Maramon Convention 2021</option>
                <option value="maramon-2023">Maramon Convention 2023</option>
                <option value="maramon-2024">Maramon Convention 2024</option>
                <option value="maramon-2025">Maramon Convention 2025</option>
                <option value="maramon-2026">Maramon Convention 2026</option>
                <option value="kottarakara-2025">Kottarakara Convention 2025</option>
                <option value="kottarakara-2026">Kottarakara Convention 2026</option>
            </select>
        </div>

        <div><strong>Progress:</strong> <span id="progress">0/0</span> have lyrics
            &nbsp;|&nbsp; <span id="draftCount">0</span> unsaved drafts
        </div>

        <div class="legend">
            <span><span class="dot" style="background:#28a745;"></span> Has lyrics</span>
            <span><span class="dot" style="background:#fd7e14;"></span> Draft (unsaved)</span>
            <span><span class="dot" style="background:#dc3545;"></span> No lyrics</span>
        </div>

        <span id="syncStatus"></span>
    </div>

    <div class="container">
        <div class="hymn-list" id="hymnList"></div>
        <div class="editor" id="editor">
            <div class="no-selection">Select a hymn to edit lyrics</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, writeBatch }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    import { firebaseConfig, ALLOWED_ADMINS } from "./firebase-config.js";

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    let app = null, auth = null, db = null;
    const hasValidKey = firebaseConfig && 
                        typeof firebaseConfig.apiKey === 'string' && 
                        firebaseConfig.apiKey.trim() !== '' && 
                        firebaseConfig.apiKey !== 'YOUR_API_KEY';

    if (hasValidKey) {
        try {
            app  = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db   = getFirestore(app);
            window._db   = db;
            window._auth = auth;

            onAuthStateChanged(auth, async (user) => {
                if (user && Array.isArray(ALLOWED_ADMINS) && ALLOWED_ADMINS.includes(user.email)) {
                    isAuthenticated = true;
                    currentUser = user.email;
                    const bar = document.getElementById('authBar');
                    if (bar) {
                        bar.className = 'auth-bar signed-in';
                        bar.innerHTML = `
                            <span style="color:#155724; font-weight:600;">✅ Signed in as ${escapeHtml(user.displayName || user.email)} (${escapeHtml(user.email)})</span>
                            <button onclick="window._auth.signOut()" style="background:#dc3545; color:white; padding:6px 12px;
                                border:none; border-radius:5px; cursor:pointer; font-size:12px;">Sign Out</button>
                        `;
                    }
                    await loadDraftsFromFirestore();
                } else if (user) {
                    signOut(auth);
                    const authMsg = document.getElementById('authMessage');
                    if (authMsg) authMsg.textContent = `❌ ${user.email} is not an authorized admin.`;
                } else {
                    isAuthenticated = false;
                    currentUser = null;
                }
            });
        } catch (e) {
            console.warn('Firebase initialization error in lyrics editor:', e);
            const authMsg = document.getElementById('authMessage');
            if (authMsg) authMsg.textContent = '⚠️ Firebase initialization failed: ' + e.message;
        }
    } else {
        console.warn('Firebase is not configured with an API key on this environment.');
        const authMsg = document.getElementById('authMessage');
        if (authMsg) authMsg.textContent = '⚠️ Cloud configuration (Firebase API key) is missing on this environment.';
    }

    // Always define signInWithGoogle so clicking the button never throws ReferenceError
    window.signInWithGoogle = async function() {
        if (!auth) {
            const msg = '⚠️ Firebase is not configured with an API key on this environment.\n\nTo enable cloud syncing on preview, please set FIREBASE_API_KEY and other Firebase variables in Cloudflare Dashboard.';
            const authMsg = document.getElementById('authMessage');
            if (authMsg) authMsg.textContent = msg;
            alert(msg);
            return;
        }
        const provider = new GoogleAuthProvider();
        try { 
            await signInWithPopup(auth, provider); 
        } catch(err) { 
            const authMsg = document.getElementById('authMessage');
            if (authMsg) authMsg.textContent = 'Sign-in failed: ' + err.message; 
        }
    };

    // ── Firestore: load all drafts for current collection ────────────────────
    window.loadDraftsFromFirestore = async function() {
        if (!isAuthenticated || !currentCollection) return;
        try {
            updateSyncStatus('⬇️ Loading drafts...');
            const snap = await getDocs(collection(db, 'lyricsEdits', currentCollection, 'songs'));
            drafts = {};
            snap.forEach(d => { drafts[d.id] = d.data().lyrics; });
            mergeDraftsIntoSongs();
            displayHymnList();
            updateStats();
            updateSyncStatus(`✅ ${Object.keys(drafts).length} draft(s) loaded`);
            setTimeout(() => updateSyncStatus(''), 3000);
        } catch(err) {
            console.error('Firestore load error:', err);
            updateSyncStatus('⚠️ Could not load drafts');
            setTimeout(() => updateSyncStatus(''), 4000);
        }
    };

    // ── Firestore: save a single song's draft ────────────────────────────────
    window.saveDraftToFirestore = async function(songNumber, lyrics) {
        if (!isAuthenticated) return false;
        try {
            updateSyncStatus('⬆️ Saving...');
            const key = String(songNumber);
            await setDoc(doc(db, 'lyricsEdits', currentCollection, 'songs', key), { lyrics });
            updateSyncStatus(`✅ Saved ${new Date().toLocaleTimeString()}`);
            setTimeout(() => updateSyncStatus(''), 3000);
            return true;
        } catch(err) {
            console.error('Firestore save error:', err);
            updateSyncStatus('❌ Save failed');
            setTimeout(() => updateSyncStatus(''), 4000);
            return false;
        }
    };

    // ── Firestore: clear all drafts for current collection ───────────────────
    window.clearDraftsFromFirestore = async function() {
        if (!isAuthenticated) return false;
        try {
            updateSyncStatus('🗑️ Clearing drafts...');
            const snap = await getDocs(collection(db, 'lyricsEdits', currentCollection, 'songs'));
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
            updateSyncStatus('✅ Drafts cleared');
            setTimeout(() => updateSyncStatus(''), 3000);
            return true;
        } catch(err) {
            console.error('Firestore clear error:', err);
            updateSyncStatus('❌ Clear failed');
            setTimeout(() => updateSyncStatus(''), 4000);
            return false;
        }
    };
    </script>

    <script>
        let songs            = [];   // base data from JSON
        let drafts           = {};   // { songNumber: lyrics } — from Firestore
        let mergedSongs      = [];   // songs with drafts applied on top
        let currentSong      = null;
        let currentCollection = 'kristheeya-keerthanangal';
        let isAuthenticated  = false;
        let currentUser      = null;

        // Apply drafts on top of base JSON songs
        function mergeDraftsIntoSongs() {
            mergedSongs = songs.map(s => {
                const key = String(s.number);
                if (drafts[key] !== undefined) {
                    return { ...s, lyrics: drafts[key], _isDraft: true };
                }
                return { ...s, _isDraft: false };
            });
        }

        function updateSyncStatus(msg) {
            document.getElementById('syncStatus').textContent = msg;
        }

        async function loadCollection() {
            currentCollection = document.getElementById('collectionSelect').value;
            drafts = {};
            mergedSongs = [];
            currentSong = null;
            document.getElementById('editor').innerHTML = '<div class="no-selection">Select a hymn to edit lyrics</div>';

            try {
                const res = await fetch(`../data/${currentCollection}.json`);
                songs = await res.json();
                mergeDraftsIntoSongs();
                displayHymnList();
                updateStats();
                // Pull drafts from Firestore if signed in
                if (isAuthenticated) await loadDraftsFromFirestore();
            } catch(err) {
                alert('Error loading collection: ' + err.message);
            }
        }

        // Load default collection on page load
        loadCollection();

        function displayHymnList() {
            const listEl = document.getElementById('hymnList');
            listEl.innerHTML = mergedSongs.map(song => {
                let className;
                if (song._isDraft)                                  className = 'has-draft';
                else if (song.lyrics && song.lyrics.trim().length > 0) className = 'has-lyrics';
                else                                                    className = 'no-lyrics';

                const displayNumber = typeof song.number === 'string' ? song.number : `#${song.number}`;
                const draftBadge    = song._isDraft ? '<span class="draft-badge">draft</span>' : '';

                return `
                    <div class="hymn-item ${className}" onclick="selectHymn('${song.number}')">
                        <strong>${displayNumber}</strong>${draftBadge} — ${song.name}
                    </div>
                `;
            }).join('');
        }

        function selectHymn(number) {
            currentSong = mergedSongs.find(s => s.number == number);
            if (!currentSong) return;

            document.querySelectorAll('.hymn-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.hymn-item').classList.add('active');

            const displayNumber = typeof currentSong.number === 'string' ? currentSong.number : `#${currentSong.number}`;
            const draftNote = currentSong._isDraft
                ? `<span class="draft-badge">unsaved draft</span>`
                : '';

            document.getElementById('editor').innerHTML = `
                <h2>${displayNumber} — ${currentSong.name} ${draftNote}</h2>
                <textarea id="lyricsInput" placeholder="Enter lyrics in Malayalam...">${currentSong.lyrics || ''}</textarea>
                <div class="buttons">
                    <button class="save-btn" onclick="saveLyrics()">💾 Save to Cloud</button>
                    <button class="clear-btn" onclick="clearLyrics()">🗑️ Clear</button>
                    <button class="download-btn" onclick="downloadJSON()">⬇️ Download JSON</button>
                    <button class="clear-drafts-btn" onclick="confirmClearDrafts()">🧹 Clear All Drafts</button>
                </div>
                <p style="margin-top:10px; font-size:12px; color:#6c757d;">
                    💡 <strong>Save to Cloud</strong> stores a draft in the cloud instantly.
                    Once you're done editing, <strong>Download JSON</strong> and commit the file to make changes permanent.
                    Then use <strong>Clear All Drafts</strong> to reset the draft layer.
                </p>
            `;
        }

        async function saveLyrics() {
            if (!currentSong) return;

            const lyrics = document.getElementById('lyricsInput').value;
            const key    = String(currentSong.number);

            // Update in-memory
            currentSong.lyrics  = lyrics;
            currentSong._isDraft = true;
            drafts[key] = lyrics;

            const idx = mergedSongs.findIndex(s => s.number == currentSong.number);
            if (idx !== -1) mergedSongs[idx] = { ...mergedSongs[idx], lyrics, _isDraft: true };

            displayHymnList();
            updateStats();

            // Re-highlight the active item
            document.querySelectorAll('.hymn-item').forEach(item => {
                if (item.querySelector('strong')?.textContent.replace('#','') == String(currentSong.number).replace('#','')) {
                    item.classList.add('active');
                }
            });

            if (isAuthenticated) {
                await saveDraftToFirestore(currentSong.number, lyrics);
            } else {
                alert('⚠️ Not signed in — lyrics saved in memory only.\n\nSign in to persist drafts to the cloud.');
            }
        }

        function clearLyrics() {
            if (confirm('Clear lyrics for this hymn?')) {
                document.getElementById('lyricsInput').value = '';
            }
        }

        function downloadJSON() {
            // Merge drafts into base songs for the final output
            const output = songs.map(s => {
                const key = String(s.number);
                if (drafts[key] !== undefined) return { ...s, lyrics: drafts[key] };
                return s;
            });

            const dataStr = JSON.stringify(output, null, 2);
            const blob    = new Blob([dataStr], { type: 'application/json' });
            const url     = URL.createObjectURL(blob);
            const a       = document.createElement('a');
            a.href        = url;
            a.download    = `${currentCollection}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function confirmClearDrafts() {
            const draftKeys = Object.keys(drafts);
            if (draftKeys.length === 0) {
                alert('No drafts to clear for this collection.');
                return;
            }
            if (!confirm(`Clear all ${draftKeys.length} draft(s) for "${currentCollection}"?\n\nOnly do this after you have committed the downloaded JSON file.`)) return;

            drafts = {};
            mergeDraftsIntoSongs();
            displayHymnList();
            updateStats();
            document.getElementById('editor').innerHTML = '<div class="no-selection">Select a hymn to edit lyrics</div>';

            if (isAuthenticated) {
                await clearDraftsFromFirestore();
            }
        }

        function updateStats() {
            const withLyrics = mergedSongs.filter(s => s.lyrics && s.lyrics.trim().length > 0).length;
            const draftCount = mergedSongs.filter(s => s._isDraft).length;
            document.getElementById('progress').textContent   = `${withLyrics}/${mergedSongs.length}`;
            document.getElementById('draftCount').textContent = draftCount;
        }
    </script>

    </div>
<script>
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        setTheme(savedTheme);
    }
    function setTheme(theme) {
        const btn = document.getElementById('themeToggleBtn');
        if (theme === 'light') {
            document.body.classList.add('light-mode');
            if (btn) btn.textContent = '☀️';
            localStorage.setItem('theme', 'light');
        } else {
            document.body.classList.remove('light-mode');
            if (btn) btn.textContent = '🌙';
            localStorage.setItem('theme', 'dark');
        }
    }
    function toggleTheme() {
        const isLight = document.body.classList.contains('light-mode');
        setTheme(isLight ? 'dark' : 'light');
    }
    initTheme();
</script>
</body>
</html>
