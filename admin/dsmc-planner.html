<head>

    <link rel=preconnect href="https://fonts.gstatic.com" crossorigin>

            --bg-base: #060913;
            --card-bg: rgba(18, 24, 43, 0.8);
            --card-hover-bg: rgba(28, 38, 68, 0.9);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --accent-gold: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            
            --input-bg: rgba(15, 23, 42, 0.75);
            --input-border: rgba(255, 255, 255, 0.14);
            --input-focus-border: #38bdf8;
            
            --section-bg: rgba(255, 255, 255, 0.03);
            --section-border: rgba(255, 255, 255, 0.08);
        }

        body.light-mode {
            --bg-base: #f4f6fb;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-hover-bg: #ffffff;
            --card-border: rgba(203, 213, 225, 0.8);
            --card-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --accent-primary: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.15);
            --accent-gold: #d97706;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #6366f1 50%, #8b5cf6 100%);
            
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-focus-border: #0284c7;
            
            --section-bg: #f8fafc;
            --section-border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: 20px 12px; 
            background: var(--bg-base); 
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
        }

        /* Ambient Glow */
        .ambient-glow-wrap { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .ambient-sphere { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; }
        .ambient-sphere-1 { width: 600px; height: 600px; top: -150px; left: 10%; background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, transparent 70%); }
        .ambient-sphere-2 { width: 650px; height: 650px; top: 30%; right: -200px; background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 70%); }

        .container { 
            max-width: 960px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            border-radius: 24px; 
            padding: 28px; 
            box-shadow: var(--card-shadow); 
            backdrop-filter: blur(16px);
            position: relative;
            z-index: 1;
        }

        .ml { font-family: 'Noto Sans Malayalam', 'Manjari', sans-serif; }

        .app-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .btn-top-nav {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-top-nav:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent-primary);
            transform: translateX(-2px);
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        h1 { color: var(--text-primary); margin-bottom: 4px; font-size: 1.85rem; font-weight: 800; letter-spacing: -0.02em; }
        .subtitle { color: var(--text-secondary); margin-bottom: 20px; font-size: 0.95rem; }

        /* Auth */
        #authSection { 
            background: rgba(245, 158, 11, 0.12); 
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 16px; 
            border-radius: 14px; 
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        #authInfo { 
            display: none; 
            background: rgba(16, 185, 129, 0.12); 
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 12px 18px; 
            border-radius: 14px; 
            margin-bottom: 20px; 
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Date row */
        .date-row { 
            background: var(--section-bg); 
            border: 1px solid var(--section-border);
            padding: 16px; 
            border-radius: 14px; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            flex-wrap: wrap; 
        }
        .date-row label { font-weight: 700; color: var(--text-primary); font-size: 0.9rem; }
        .date-row input[type=date] { 
            padding: 9px 14px; 
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1.5px solid var(--input-border); 
            border-radius: 10px; 
            font-size: 0.95rem; 
            outline: none;
            font-family: inherit;
        }
        .date-row input[type=date]:focus { border-color: var(--accent-primary); }
        #syncStatus { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

        /* Controls */
        .controls { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        button { 
            padding: 10px 18px; 
            background: var(--accent-primary); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 0.88rem; 
            font-weight: 700; 
            white-space: nowrap; 
            transition: all 0.2s ease; 
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px var(--accent-glow); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-save { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-history { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
        .btn-whatsapp { background: #25d366; color: #042f2e; }
        .btn-whatsapp:hover:not(:disabled) { background: #22c55e; color: white; }
        .btn-print { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); border: 1px solid var(--card-border); }
        .btn-danger { background: #ef4444; }

        /* Groups */
        .group-section { 
            background: var(--section-bg); 
            border: 1px solid var(--section-border);
            padding: 18px; 
            border-radius: 16px; 
            margin-bottom: 16px; 
            position: relative;
        }
        .group-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .group-number { 
            background: var(--accent-gradient); 
            color: white; 
            border-radius: 8px; 
            width: 28px; 
            height: 28px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 13px; 
            font-weight: 800; 
            flex-shrink: 0; 
        }
        .group-title { font-size: 1.1rem; font-weight: 800; color: var(--text-primary); }

        /* Slot rows */
        .slot-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
        .slot-label { font-size: 0.88rem; color: var(--text-secondary); min-width: 150px; font-weight: 600; }
        .slot-wrap { flex: 1; min-width: 200px; }
        .slot-select { 
            width: 100%; 
            padding: 10px 12px; 
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1.5px solid var(--input-border); 
            border-radius: 10px; 
            font-size: 0.9rem; 
            cursor: pointer; 
            outline: none;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .slot-select:focus { border-color: var(--accent-primary); }
        .slot-select:disabled { opacity: 0.6; cursor: not-allowed; }
        .slot-hint { font-size: 0.78rem; color: var(--accent-gold); margin-top: 3px; font-weight: 600; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; padding: 16px; overflow-y: auto; backdrop-filter: blur(8px); }
        .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-primary); margin: 30px auto; padding: 24px; border-radius: 20px; max-width: 800px; max-height: 90vh; overflow-y: auto; box-shadow: var(--card-shadow); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
        .modal-header h2 { font-size: 1.35rem; font-weight: 800; }
        .close-btn { font-size: 26px; cursor: pointer; color: var(--text-muted); line-height: 1; }
        .close-btn:hover { color: var(--text-primary); }

        /* History */
        .history-item { background: var(--section-bg); border: 1px solid var(--section-border); padding: 16px; border-radius: 12px; margin-bottom: 12px; }
        .history-date { font-weight: 800; color: var(--accent-primary); font-size: 0.95rem; margin-bottom: 8px; }
        .history-slot-row { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 3px; }
        .history-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

        @media print {
            body { background: white !important; color: black !important; padding: 0; }
            .ambient-glow-wrap, .controls, .modal, #authSection, #authInfo, .app-header-row { display: none !important; }
            .container { box-shadow: none !important; border: none !important; padding: 20px !important; max-width: 100% !important; background: white !important; }
            .slot-select { border: none !important; appearance: none !important; background: transparent !important; padding: 0 !important; color: black !important; font-size: 14px !important; pointer-events: none !important; }
            h1, .subtitle, .group-title, .slot-label { color: black !important; }
            .group-section { background: white !important; border: 1px solid #ddd !important; }
        }
    </style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig, ALLOWED_ADMINS } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window._db = db;
window._auth = auth;

onAuthStateChanged(auth, async (user) => {
    if (user && ALLOWED_ADMINS.includes(user.email)) {
        isAuthenticated = true;
        currentUser = user.email;
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('authInfo').style.display = 'block';
        document.getElementById('authInfo').innerHTML = `
            <span style="color:#155724; font-weight:600;">Welcome ${user.displayName}</span>
            <button onclick="window._auth.signOut()" style="background:#dc3545; color:white; padding:6px 12px; margin-left:12px; border:none; border-radius:5px; cursor:pointer; font-size:12px;">Sign Out</button>
        `;
        document.getElementById('btnSave').disabled = false;
        document.getElementById('btnAutoFill').disabled = false;
        setSelectsDisabled(false);
        await loadFromFirestore();
    } else if (user) {
        signOut(auth);
        document.getElementById('authMessage').textContent = `❌ ${user.email} is not an authorized admin.`;
    } else {
        isAuthenticated = false;
        currentUser = null;
        document.getElementById('authSection').style.display = 'block';
        document.getElementById('authInfo').style.display = 'none';
        document.getElementById('btnSave').disabled = true;
        setSelectsDisabled(true);
        await loadFromFirestore();
    }
});

window.signInWithGoogle = async function() {
    const provider = new GoogleAuthProvider();
    try { await signInWithPopup(auth, provider); }
    catch(err) { document.getElementById('authMessage').textContent = 'Sign-in failed: ' + err.message; }
};

window.loadFromFirestore = async function() {
    try {
        updateSyncStatus('⬇️ Loading...');
        const [schedSnap, attSnap] = await Promise.all([
            getDocs(collection(db, 'dsmcSchedule')),
            getDocs(collection(db, 'choirAttendance'))
        ]);
        scheduleHistory = [];
        schedSnap.forEach(d => scheduleHistory.push(d.data()));
        scheduleHistory.sort((a, b) => b.date - a.date);

        attendanceData = {};
        attSnap.forEach(d => {
            const decoded = {};
            for (const [k, v] of Object.entries(d.data())) {
                decoded[k.replace(/__dot__/g, '.')] = v;
            }
            attendanceData[d.id] = decoded;
        });

        updateSyncStatus(`✅ ${scheduleHistory.length} schedules loaded`);
        setTimeout(() => updateSyncStatus(''), 3000);
        loadScheduleForCurrentDate();
    } catch(err) {
        console.error(err);
        updateSyncStatus('⚠️ Cloud load failed');
        setTimeout(() => updateSyncStatus(''), 3000);
    }
};

window.saveToFirestore = async function(record) {
    if (!isAuthenticated) return false;
    try {
        await setDoc(doc(db, 'dsmcSchedule', record.dateStr), record);
        return true;
    } catch(err) { console.error(err); return false; }
};

window.deleteFromFirestore = async function(dateStr) {
    if (!isAuthenticated) return false;
    try {
        await deleteDoc(doc(db, 'dsmcSchedule', dateStr));
        return true;
    } catch(err) { console.error(err); return false; }
};
</script>

    { number: 9, ml: 'തൂബ്ദേൻ ഭാഗങ്ങൾ',                   slots: ['thubden1','thubden2','thubden3','thubden4','thubden5']},
];

const slotMap = Object.fromEntries(SLOT_DEFS.map(s => [s.id, s]));

function getMemberList(gender) {
    const f = members.female || [];
    const m = members.male   || [];
    // occasional members are excluded from all auto-fill and dropdowns
    if (gender === 'female') return [...f].sort();
    if (gender === 'male')   return [...m].sort();
    return [...f, ...m].sort();
}

// Returns true if the member has no 'P' record in the last 2 months of attendance data
function isContinuouslyAbsent(name) {
    const twoMonthsAgo = Date.now() - (60 * 24 * 60 * 60 * 1000);
    const recentDates = Object.keys(attendanceData).filter(d => new Date(d).getTime() >= twoMonthsAgo);
    if (!recentDates.length) return false; // no data → don't penalise
    const wasPresent = recentDates.some(d => attendanceData[d][name] === 'P');
    return !wasPresent;
}

function renderForm(slots, lastYearSlots) {
    const html = GROUPS.map(group => {
        const slotsHtml = group.slots.map(slotId => {
            const def = slotMap[slotId];
            const list = getMemberList(def.gender);
            const selected = slots[slotId] || '';
            const lastYearPerson = lastYearSlots?.[slotId] || '';

            let options = `<option value="">-- Select Member --</option>`;
            list.forEach(name => {
                options += `<option value="${name}"${name === selected ? ' selected' : ''}>${name}</option>`;
            });
            if (selected && !list.includes(selected)) {
                options += `<option value="${selected}" selected>${selected}</option>`;
            }

            const hint = lastYearPerson
                ? `<div class="slot-hint">⚠️ Last Year: ${lastYearPerson}</div>`
                : '';

            return `
                <div class="slot-row">
                    <span class="slot-label ml">${def.ml}</span>
                    <div class="slot-wrap">
                        <select class="slot-select" id="slot_${slotId}">${options}</select>
                        ${hint}
                    </div>
                </div>`;
        }).join('');

        return `
            <div class="group-section">
                <div class="group-header">
                    <span class="group-number">${group.number}</span>
                    <span class="group-title ml">${group.ml}</span>
                </div>
                ${slotsHtml}
            </div>`;
    }).join('');

    document.getElementById('scheduleForm').innerHTML = html;
    if (!isAuthenticated) setSelectsDisabled(true);
}

function setSelectsDisabled(disabled) {
    document.querySelectorAll('.slot-select').forEach(el => el.disabled = disabled);
    const btn = document.getElementById('btnAutoFill');
    if (btn) { btn.disabled = disabled; btn.style.opacity = disabled ? '0.45' : '1'; }
}

function getCurrentSlots() {
    const slots = {};
    SLOT_DEFS.forEach(def => {
        const el = document.getElementById(`slot_${def.id}`);
        if (el) slots[def.id] = el.value;
    });
    return slots;
}

function getLastYearMaySlots(currentDateStr) {
    if (!currentDateStr) return null;
    const year = parseInt(currentDateStr.split('-')[0]);
    const lastYear = year - 1;
    // Find any saved May schedule from last year
    const lastYearRecord = scheduleHistory.find(s => {
        const [y, m] = s.dateStr.split('-').map(Number);
        return y === lastYear && m === 5;
    });
    return lastYearRecord ? (lastYearRecord.slots || {}) : null;
}

function loadScheduleForCurrentDate() {
    const dateStr = document.getElementById('scheduleDate').value;
    if (!dateStr) return;
    const existing = scheduleHistory.find(s => s.dateStr === dateStr);
    const lastYearSlots = getLastYearMaySlots(dateStr);
    renderForm(existing ? (existing.slots || {}) : {}, lastYearSlots);
}

function autoFill() {
    const dateStr = document.getElementById('scheduleDate').value;
    if (!dateStr) { alert('Please select a date first.'); return; }

    const lastYearSlots = getLastYearMaySlots(dateStr) || {};
    const assigned = new Set();

    const suggested = {};
    SLOT_DEFS.forEach(def => {
        const pool = getMemberList(def.gender);
        const lastYearPerson = lastYearSlots[def.id] || '';

        // Tier 1: not last year's person, not continuously absent, not yet assigned
        let preferred = pool.filter(p =>
            p !== lastYearPerson && !isContinuouslyAbsent(p) && !assigned.has(p));

        // Tier 2: relax last-year constraint (still present, not yet assigned)
        if (!preferred.length)
            preferred = pool.filter(p => !isContinuouslyAbsent(p) && !assigned.has(p));

        // Tier 3: relax absence constraint (not last year, not yet assigned)
        if (!preferred.length)
            preferred = pool.filter(p => p !== lastYearPerson && !assigned.has(p));

        // Tier 4: anyone not yet assigned
        if (!preferred.length)
            preferred = pool.filter(p => !assigned.has(p));

        // Last resort: full pool
        if (!preferred.length) preferred = pool;

        const pick = preferred[Math.floor(Math.random() * preferred.length)];
        suggested[def.id] = pick;
        assigned.add(pick);
    });

    // Only fill empty slots — respect any manual selections already made
    SLOT_DEFS.forEach(def => {
        const el = document.getElementById(`slot_${def.id}`);
        if (!el || el.value) return;
        el.value = suggested[def.id] || '';
    });
}

function updateSyncStatus(msg) {
    document.getElementById('syncStatus').textContent = msg;
}

async function saveSchedule() {
    if (!isAuthenticated) { alert('🔒 Please sign in to save.'); return; }
    const dateStr = document.getElementById('scheduleDate').value;
    if (!dateStr) { alert('Please select a date.'); return; }

    const slots = getCurrentSlots();
    const record = { dateStr, date: new Date(dateStr).getTime(), slots };

    const existingIdx = scheduleHistory.findIndex(s => s.dateStr === dateStr);
    if (existingIdx >= 0) scheduleHistory[existingIdx] = record;
    else scheduleHistory.unshift(record);
    scheduleHistory.sort((a, b) => b.date - a.date);

    const ok = await saveToFirestore(record);
    if (ok) {
        updateSyncStatus('✅ Saved!');
        setTimeout(() => updateSyncStatus(''), 3000);
    } else {
        alert('⚠️ Save failed. Please try again.');
    }
}

function showHistory() {
    document.getElementById('historyModal').style.display = 'block';
    renderHistory();
}

function closeHistory() {
    document.getElementById('historyModal').style.display = 'none';
}

function renderHistory() {
    if (scheduleHistory.length === 0) {
        document.getElementById('historyList').innerHTML = '<p style="color:var(--text-muted); padding:20px; text-align:center;">No saved schedules found.</p>';
        return;
    }

    const html = scheduleHistory.map(record => {
        const d = new Date(record.date).toLocaleDateString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        const slotsHtml = GROUPS.map(group => {
            const filled = group.slots.map(sid => record.slots?.[sid]).filter(Boolean);
            if (!filled.length) return '';
            return `<div class="history-slot-row"><strong class="ml">${group.ml}:</strong> ${filled.join(', ')}</div>`;
        }).join('');

        const ds = record.dateStr;
        const actions = isAuthenticated
            ? `<div class="history-actions">
                   <button class="btn-edit" onclick="loadForEdit('${ds}')" style="padding:6px 12px; font-size:12px;">✏️ Edit</button>
                   <button class="btn-danger" onclick="deleteSchedule('${ds}')" style="padding:6px 12px; font-size:12px;">🗑️ Delete</button>
                   <button class="btn-whatsapp" onclick="shareHistoryItem('${ds}')" style="padding:6px 12px; font-size:12px;">📱 Share</button>
               </div>`
            : `<div class="history-actions">
                   <button class="btn-whatsapp" onclick="shareHistoryItem('${ds}')" style="padding:6px 12px; font-size:12px;">📱 Share</button>
               </div>`;

        return `
            <div class="history-item">
                <div class="history-date">📅 ${d}</div>
                <div style="margin-top:6px;">${slotsHtml || '<span style="color:#aaa;font-size:12px;">No assignments saved.</span>'}</div>
                ${actions}
            </div>`;
    }).join('');

    document.getElementById('historyList').innerHTML = html;
}

function loadForEdit(dateStr) {
    document.getElementById('scheduleDate').value = dateStr;
    loadScheduleForCurrentDate();
    closeHistory();
    window.scrollTo(0, 0);
}

async function deleteSchedule(dateStr) {
    const d = new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    if (!confirm(`Delete schedule for ${d}?`)) return;
    scheduleHistory = scheduleHistory.filter(s => s.dateStr !== dateStr);
    await deleteFromFirestore(dateStr);
    renderHistory();
    if (document.getElementById('scheduleDate').value === dateStr) renderForm({});
}

function buildShareMessage(record) {
    const d = new Date(record.date).toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    let msg = `*DSMC SUNDAY PROGRAMME*\n`;
    msg += `\u{1F4C5} ${d}\n\n`;
    msg += `━━━━━━━━━━━━━━━\n\n`;
    GROUPS.forEach(group => {
        const filled = group.slots.map(sid => record.slots?.[sid]).filter(Boolean);
        if (!filled.length) return;
        msg += `*${group.number}. ${group.ml}*\n`;
        msg += filled.join('\n') + '\n\n';
    });
    msg += `━━━━━━━━━━━━━━━\n`;
    msg += `KTR MTC DSMC`;
    return msg;
}

function shareToWhatsApp() {
    const dateStr = document.getElementById('scheduleDate').value;
    if (!dateStr) { alert('Please select a date.'); return; }
    const record = { dateStr, date: new Date(dateStr).getTime(), slots: getCurrentSlots() };
    window.open(`https://wa.me/?text=${encodeURIComponent(buildShareMessage(record))}`, '_blank');
}

function shareHistoryItem(dateStr) {
    const record = scheduleHistory.find(s => s.dateStr === dateStr);
    if (!record) return;
    window.open(`https://wa.me/?text=${encodeURIComponent(buildShareMessage(record))}`, '_blank');
}

window.onclick = function(e) {
    if (e.target === document.getElementById('historyModal')) closeHistory();
};

async function init() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('scheduleDate').value = today;
    document.getElementById('scheduleDate').addEventListener('change', loadScheduleForCurrentDate);

    try {
        const resp = await fetch('../data/choir-members.json');
        members = await resp.json();
    } catch(e) {
        console.error('Could not load choir-members.json:', e);
    }

    renderForm({});
}

init();
</script>

<script>
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        setTheme(savedTheme);
    }
    function setTheme(theme) {
        const btn = document.getElementById('themeToggleBtn');
        if (theme === 'light') {
            document.body.classList.add('light-mode');
            if (btn) btn.textContent = '☀️';
            localStorage.setItem('theme', 'light');
        } else {
            document.body.classList.remove('light-mode');
            if (btn) btn.textContent = '🌙';
            localStorage.setItem('theme', 'dark');
        }
    }
    function toggleTheme() {
        const isLight = document.body.classList.contains('light-mode');
        setTheme(isLight ? 'dark' : 'light');
    }
    initTheme();
</script>
